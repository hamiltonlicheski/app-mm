/* =========================================================
   COLEÇÕES ESPECIAIS (easter eggs da equipe)
   Visuais inspirados em pessoas que fizeram parte da criação do Educatata:
   a equipe, amigos, família, professores e a turma de Ciência da Computação
   da PUCPR (2026). O título de cada coleção representa a pessoa sem dizer o
   nome (o nome só fica quando não há outra forma clara, como na Turma do Código).
   São referências carinhosas, desenhadas do zero (nada copiado de personagens
   de outras marcas), e com temas adequados para crianças.
   Cada acessório é desenhado no quadro de 64 x 64 do mascote:
   corpo = elipse (32, 38) com raios 22 x 20 (topo da cabeça em y = 18);
   olhos em (25, 32) e (39, 32); boca por volta de y = 42; "lado" = o que ele segura.
   ========================================================= */
// formas no quadro do mascote (o teste usa o centro do pixel)
const AE = (cx, cy, rx, ry) => (x, y) => ((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1;
const AR = (x0, y0, x1, y1) => (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
const AP = pts => { const f = poligono(pts); return (x, y) => f(x + .5, y + .5); };
const AA = (cx, cy, r1, r2) => (x, y) => { const d = Math.hypot(x + .5 - cx, y + .5 - cy); return d <= r1 && d > r2; };
const AU = (...fs) => (x, y) => fs.some(f => f(x, y));
const AL = (x0, y0, x1, y1, esp = .8) => (x, y) => {
  const px = x + .5, py = y + .5, dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / L)) : 0;
  return Math.hypot(px - x0 - t * dx, py - y0 - t * dy) <= esp;
};
const NO_CORPO = AE(32, 38, 22, 20);
const PONTOS = lista => { const s = new Set(lista.map(([a, b]) => a * 100 + b)); return (x, y) => s.has(x * 100 + y); };
// cabelo ou touca que cobre o alto da cabeça, acompanhando a curva do corpo
const TOPO_CABECA = (ate = 23) => (x, y) => AE(32, 38, 23, 21)(x, y) && y <= ate;
// colares: o mascote não tem pescoço, então o colar desce em "U" no peito, abaixo da boca.
// Ele vai de uma borda do corpo à outra (como se desse a volta por trás), e as contas
// diminuem perto das bordas, o que dá a sensação de profundidade.
// o ursinho desenhado na Nana, a cobertinha
const URSINHO = (d, cx, cy) => {
  d.pintar(AU(AE(cx - 2.5, cy - 3.2, 1.4, 1.4), AE(cx + 2.5, cy - 3.2, 1.4, 1.4), AE(cx, cy, 3.4, 3.1)), '#C9874A');
  d.pintar(AE(cx, cy + 1.3, 1.4, 1), '#E8C08A', false);
  d.pintar(PONTOS([[Math.floor(cx) - 1, Math.floor(cy) - 1], [Math.floor(cx) + 1, Math.floor(cy) - 1], [Math.floor(cx), Math.floor(cy) + 1]]), '#212529', false);
};
const LINHA_COLAR = x => 45 + 8 * (1 - ((x - 32) / 21) ** 2);
const COLAR = (cor = '#ADB5BD') => [(x, y) => NO_CORPO(x, y) && Math.abs(y + .5 - LINHA_COLAR(x + .5)) < .8, cor, false];
const CONTAS_EM_VOLTA = (d, n, cores, raio = 1.35) => {
  for (let k = 0; k < n; k++) {
    const cx = 12.5 + k * (39 / (n - 1)), perto = 1 - Math.abs(cx - 32) / 21;
    d.pintar(AE(cx, LINHA_COLAR(cx), raio * (.6 + .4 * perto), raio * (.6 + .4 * perto)), cores[k % cores.length]);
  }
};
// roupa em camadas: fica 1 pixel para fora do corpo (parece vestida por cima), tem contorno,
// luz em cima à esquerda e sombra embaixo à direita, em vez de uma cor lisa
const VESTE = AE(32, 38, 23, 21);
const TOM_ROUPA = (cor, sombra, luz) => (x, y) => {
  const s = (x + .5 - 32) / 23 + (y + .5 - 38) / 21;
  return s > .9 ? sombra : s < .15 && luz ? luz : cor;

  return x && x.frase ? `<p class="nuvem-pensamento pensa-mascote">${x.frase}</p>` : '';
};
// as coleções entram na loja (CORES e ITENS) e cada acessório guarda o seu desenho
// (desenhar: atrás do corpo nas "costas", na frente nos outros lugares; frente: parte que fica na frente)
const DESENHO_ACESSORIO = {}, DESENHO_FRENTE = {}, DESENHO_TOPO = {};
COLECOES.forEach(c => {
  c.cores.forEach(x => CORES.push({ ...x, colecao: c.id }));
  c.itens.forEach(({ desenhar, frente, topo, ...x }) => {
    ITENS.push({ ...x, colecao: c.id });
    DESENHO_ACESSORIO[x.id] = desenhar;
    if (frente) DESENHO_FRENTE[x.id] = frente;
    if (topo) DESENHO_TOPO[x.id] = topo;   // parte que fica por cima de tudo (ex.: conchas do headset)
  });
});
// veste uma peça: ocupa o lugar dela e, se for peça de dois lugares (campo "tambem"), libera o outro;
// também tira a peça de dois lugares que estiver usando o lugar novo
function vestir(usando, x) {
  usando[x.slot] = x.id;
  if (x.tambem) usando[x.tambem] = null;
  Object.entries(usando).forEach(([lugar, id]) => {
    const outra = id && ITENS.find(k => k.id === id);
    if (outra && outra.tambem === x.slot && lugar !== x.slot) usando[lugar] = null;
  });
  return usando;
}
// capa de cada coleção: o mascote com o visual dela (as peças de "capa", ou a 1ª cor e uma peça por lugar)
function visualDaCapa(c) {
  const ids = c.capa || [...c.cores.slice(0, 1), ...c.itens].map(x => x.id);
  const v = { cor: 'laranja', usando: {} };
  ids.forEach(id => {
    const cor = CORES.find(x => x.id === id), item = ITENS.find(x => x.id === id);
    if (cor) v.cor = id;
    else if (item && !v.usando[item.slot] && !(item.tambem && v.usando[item.tambem])) vestir(v.usando, item);
  });
  return v;
}

   Mascote em pixel art (64 x 64), desenhado ponto a ponto no código.
   Mantém as cores e os acessórios da loja. É provisório:
   para usar um desenho feito à mão, basta trocar por sprites.

const MASCOTE_TAM = 64;
const cacheMascote = new Map();
const corRGB = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const misturar = (c, alvo, t) => c.map((v, i) => Math.round(v + (alvo[i] - v) * t));

// soAcessorio: desenha só os acessórios das coleções (ícone da loja)
function desenharMascotePixel(visual, humor, olhosFechados, soAcessorio = false) {
  const N = MASCOTE_TAM;
  const grade = Array.from({ length: N }, () => Array(N).fill(null));
  const CONTORNO = [43, 42, 51];
  const elipse = (cx, cy, rx, ry) => (x, y) => {
    const a = (x + .5 - cx) / rx, b = (y + .5 - cy) / ry;
    return a * a + b * b <= 1;
  };
  // pinta os pixels de uma forma e, se pedido, um contorno escuro de 1 pixel em volta
  const pintar = (teste, cor, contorno = true) => {
    const pontos = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (teste(x, y)) pontos.push([x, y]);
    const dentro = new Set(pontos.map(([x, y]) => y * N + x));
    const corDe = typeof cor === 'function' ? cor : () => cor;
    pontos.forEach(([x, y]) => { grade[y][x] = corDe(x, y); });
    if (!contorno) return;
    pontos.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const a = x + dx, b = y + dy;
      if (a >= 0 && a < N && b >= 0 && b < N && !dentro.has(b * N + a)) grade[b][a] = CONTORNO;
    }));
  };

  const base = corRGB((CORES.find(c => c.id === visual.cor) || CORES[0]).hex);
  const sombra = misturar(base, [70, 35, 20], .3);
  const luz = misturar(base, [255, 255, 255], .5);
  const barriga = misturar(base, [255, 255, 255], .55);
  const u = visual.usando;
  // acessórios das coleções (DESENHO_ACESSORIO): cores em "#hex", convertidas aqui
  const rgb = c => typeof c === 'string' ? corRGB(c) : c;
  const d = {
    base, CONTORNO,
    pintar: (teste, cor, contorno = true) => pintar(teste, typeof cor === 'function' ? (x, y) => rgb(cor(x, y)) : rgb(cor), contorno)
  };
  const acessorio = lugar => { const f = u[lugar] && DESENHO_ACESSORIO[u[lugar]]; if (f) f(d); };
  if (soAcessorio) {
    ['costas', 'roupa', 'pescoco', 'rosto', 'cabeca', 'lado'].forEach(acessorio);
    Object.values(u).forEach(id => { if (id && DESENHO_TOPO[id]) DESENHO_TOPO[id](d); });
    return grade;
  }
  acessorio('costas');   // atrás do corpo

  // capa (fica atrás de tudo)
  if (u.costas === 'capa') {
    pintar((x, y) => y >= 30 && y <= 61 && Math.abs(x + .5 - 32) <= 18 + (y - 30) * .32,
      x => x < 32 ? [224, 49, 49] : [190, 38, 38]);
  }

  // pés e corpo
  pintar(elipse(23, 58, 7, 4), sombra);
  pintar(elipse(41, 58, 7, 4), sombra);
  pintar(elipse(32, 38, 22, 20), (x, y) => {
    const a = (x + .5 - 32) / 22, b = (y + .5 - 38) / 20, d = a * a + b * b;
    if (d > .68 && a + b > .45) return sombra;                       // sombra embaixo à direita
    if (d > .4 && d < .7 && a < -.2 && b < -.4) return luz;          // brilho em cima à esquerda
    return base;
  });
  pintar(elipse(32, 46, 12, 8), barriga, false);

  // bochechas
  pintar((x, y) => (y === 40 || y === 41) && ((x >= 15 && x <= 17) || (x >= 46 && x <= 48)), [255, 143, 163], false);

  // olhos (abertos ou piscando)
  if (olhosFechados) {
    pintar((x, y) => y === 33 && ((x >= 21 && x <= 28) || (x >= 35 && x <= 42)), CONTORNO, false);
  } else {
    pintar(elipse(25, 32, 4, 5), [255, 255, 255]);
    pintar(elipse(39, 32, 4, 5), [255, 255, 255]);
    pintar((x, y) => (x === 25 || x === 26 || x === 39 || x === 40) && y >= 32 && y <= 35, CONTORNO, false);
    pintar((x, y) => (x === 26 || x === 40) && y === 32, [255, 255, 255], false);
  }

  // sobrancelhas e boca de cada emoção (usadas no Teatro de histórias)
  const espelho = pts => pts.flatMap(([x, y]) => [[x, y], [63 - x, y]]);   // o mesmo traço nos dois lados do rosto
  const pontos = (lista, cor) => pintar((x, y) => lista.some(([a, b]) => a === x && b === y), cor, false);
  const grosso = pts => pts.flatMap(([x, y]) => [[x, y], [x, y - 1]]);       // traço de 2 pixels, para ler de longe
  const pupilaPequena = () => {                                              // olhos arregalados: pupila menor
    pintar((x, y) => (x === 25 || x === 26 || x === 39 || x === 40) && y >= 32 && y <= 35, [255, 255, 255], false);
    pintar((x, y) => (x === 25 || x === 26 || x === 39 || x === 40) && (y === 33 || y === 34), CONTORNO, false);
  };
  if (humor === 'triste') {
    pontos(espelho(grosso([[20, 24], [21, 24], [22, 23], [23, 23], [24, 22], [25, 22], [26, 21], [27, 21]])), CONTORNO);   // sobrancelhas caídas para fora
    if (!olhosFechados) pintar((x, y) => y <= 29 && (elipse(25, 32, 4, 5)(x, y) || elipse(39, 32, 4, 5)(x, y)), base, false);   // pálpebra caída
    pontos([[30, 43], [31, 43], [32, 43], [33, 43], [29, 44], [34, 44], [28, 45], [35, 45], [27, 46], [36, 46],
            [30, 44], [31, 44], [32, 44], [33, 44], [29, 45], [34, 45], [28, 46], [35, 46]], CONTORNO);   // boca bem para baixo
    pontos([[21, 38], [21, 39], [20, 40], [21, 40], [22, 40], [20, 41], [21, 41], [22, 41], [21, 42]], [116, 192, 252]);   // lágrima
  } else if (humor === 'bravo') {
    pontos(espelho(grosso([[19, 21], [20, 21], [21, 22], [22, 22], [23, 23], [24, 23], [25, 24], [26, 24], [27, 25]])), CONTORNO);   // sobrancelhas em "V"
    pintar((x, y) => x >= 27 && x <= 36 && y >= 42 && y <= 46, CONTORNO, false);                 // boca com os dentes trincados
    pintar((x, y) => x >= 28 && x <= 35 && y >= 43 && y <= 45 && x !== 30 && x !== 33, [255, 255, 255], false);
    pintar((x, y) => (y === 40 || y === 41) && ((x >= 14 && x <= 18) || (x >= 45 && x <= 49)), [240, 80, 80], false);   // bochechas vermelhas
  } else if (humor === 'assustado') {
    pontos(espelho(grosso([[20, 22], [21, 21], [22, 20], [23, 20], [24, 20], [25, 20], [26, 21], [27, 22]])), CONTORNO);   // sobrancelhas lá em cima
    if (!olhosFechados) pupilaPequena();
    pintar(elipse(32, 44.5, 5, 2.6), CONTORNO, false);                                            // boca aberta, tremendo
    pontos([[29, 43], [30, 43], [31, 43], [32, 43], [33, 43], [34, 43], [35, 43]], [255, 255, 255]);
    pontos([[47, 23], [47, 24], [46, 25], [47, 25], [48, 25], [46, 26], [47, 26], [48, 26],
            [16, 26], [16, 27], [15, 28], [16, 28], [17, 28]], [165, 216, 255]);                   // gotas de suor
  } else if (humor === 'surpreso') {
    pontos(espelho(grosso([[20, 21], [21, 20], [22, 19], [23, 19], [24, 19], [25, 19], [26, 20], [27, 21]])), CONTORNO);
    if (!olhosFechados) pupilaPequena();
    pintar(elipse(32, 44.5, 3.6, 4.2), CONTORNO, false);                                          // boca em "O" bem grande
    pintar(elipse(32, 44.5, 2.1, 2.8), [150, 40, 60], false);
  }

  // boca
  if (['triste', 'bravo', 'assustado', 'surpreso'].includes(humor)) {
    // já desenhada acima
  } else if (humor === 'feliz') {
    const linhas = [[41, 26, 37], [42, 27, 36], [43, 28, 35], [44, 29, 34], [45, 31, 32]];
    pintar((x, y) => linhas.some(([l, a, b]) => y === l && x >= a && x <= b), CONTORNO, false);
    pintar((x, y) => y === 44 && x >= 31 && x <= 32, [255, 107, 107], false);
  } else {
    pintar((x, y) => (y === 42 && x >= 29 && x <= 34) || (y === 41 && (x === 28 || x === 35)), CONTORNO, false);
  }

  acessorio('roupa');   // a roupa fica por baixo dos colares e do cachecol
  // acessórios
  if (u.rosto === 'oculos') {
    pintar((x, y) => {
      const d1 = Math.hypot(x + .5 - 25, y + .5 - 32.5), d2 = Math.hypot(x + .5 - 39, y + .5 - 32.5);
      return (d1 >= 5.6 && d1 <= 6.8) || (d2 >= 5.6 && d2 <= 6.8);
    }, CONTORNO, false);
  }
  if (u.pescoco === 'cachecol') {
    const corpo = elipse(32, 38, 22, 20);
    pintar((x, y) => corpo(x, y) && y >= 48 && y <= 51, x => x % 4 < 2 ? [224, 49, 49] : [250, 82, 82]);
    pintar((x, y) => x >= 40 && x <= 43 && y >= 52 && y <= 58, [190, 38, 38]);
  }
  if (u.cabeca === 'chapeu') {
    pintar((x, y) => x >= 22 && x <= 41 && y >= 4 && y <= 16, [76, 110, 245]);
    pintar((x, y) => x >= 22 && x <= 41 && y >= 12 && y <= 14, [255, 212, 59], false);
    pintar(elipse(32, 18, 16, 3), [54, 79, 199]);
  }
  if (u.cabeca === 'laco') {
    // laço em cima da cabeça, um pouco à direita (centro em cx, cy); fica apoiado no corpo, não solto
    const cx = 40, cy = 21.5;
    pintar((x, y) => (x >= cx - 7 && x <= cx && Math.abs(y + .5 - cy) <= (cx + .5 - x) * .75 + .5) ||
                     (x >= cx && x <= cx + 7 && Math.abs(y + .5 - cy) <= (x - cx + .5) * .75 + .5), [240, 101, 149]);
    pintar((x, y) => x >= cx - 1 && x <= cx + 1 && y >= cy - 1.5 && y <= cy + .5, [214, 51, 108], false);
  }
  if (u.cabeca === 'coroa') {
    const pontas = [23, 32, 41];
    pintar((x, y) => (x >= 21 && x <= 42 && y >= 14 && y <= 19) ||
                     pontas.some(c => y >= 6 + Math.abs(x + .5 - c - .5) * 2 && y < 14),
      x => x > 32 ? [224, 168, 0] : [255, 212, 59]);
    pintar((x, y) => x >= 31 && x <= 32 && y >= 15 && y <= 17, [224, 49, 49], false);
  }
  if (u.costas && DESENHO_FRENTE[u.costas]) DESENHO_FRENTE[u.costas](d);   // parte da frente de um item das costas
  ['pescoco', 'rosto', 'cabeca', 'lado'].forEach(acessorio);   // acessórios das coleções, na frente
  Object.values(u).forEach(id => { if (id && DESENHO_TOPO[id]) DESENHO_TOPO[id](d); });   // partes que ficam por cima de tudo
  return grade;
}

// ícone de um acessório das coleções para a loja: o desenho dele sozinho, recortado e ampliado por inteiro
const cacheIcone = new Map();
function iconeAcessorio(x, alvo = 42) {
  if (!cacheIcone.has(x.id)) {
    const g = desenharMascotePixel({ cor: 'laranja', usando: { [x.slot]: x.id } }, 'normal', false, true);
    let x0 = MASCOTE_TAM, y0 = MASCOTE_TAM, x1 = -1, y1 = -1;
    g.forEach((l, y) => l.forEach((c, k) => { if (c) { x0 = Math.min(x0, k); x1 = Math.max(x1, k); y0 = Math.min(y0, y); y1 = Math.max(y1, y); } }));
    const w = Math.max(1, x1 - x0 + 1), h = Math.max(1, y1 - y0 + 1);
    const tela = document.createElement('canvas');
    tela.width = w; tela.height = h;
    const ctx = tela.getContext('2d'), img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let k = 0; k < w; k++) {
      const c = g[y + y0][k + x0];
      if (!c) continue;
      const i = (y * w + k) * 4;
      img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    cacheIcone.set(x.id, { url: tela.toDataURL(), w, h });
  }
  const { url, w, h } = cacheIcone.get(x.id), e = Math.max(1, Math.floor(alvo / Math.max(w, h)));
  return `<img class="px" src="${url}" width="${w * e}" height="${h * e}" alt="">`;
}

// devolve a imagem (data URL) de um quadro do mascote, guardando para não redesenhar
function quadroMascote(visual, humor, olhosFechados) {
  const chave = JSON.stringify([visual.cor, visual.usando, humor, olhosFechados]);
  if (!cacheMascote.has(chave)) {
    const grade = desenharMascotePixel(visual, humor, olhosFechados);
    const tela = document.createElement('canvas');
    tela.width = tela.height = MASCOTE_TAM;
    const ctx = tela.getContext('2d');
    const img = ctx.createImageData(MASCOTE_TAM, MASCOTE_TAM);
    grade.forEach((linha, y) => linha.forEach((cor, x) => {
      if (!cor) return;
      const i = (y * MASCOTE_TAM + x) * 4;
      img.data[i] = cor[0]; img.data[i + 1] = cor[1]; img.data[i + 2] = cor[2]; img.data[i + 3] = 255;
    }));
    ctx.putImageData(img, 0, 0);
    cacheMascote.set(chave, tela.toDataURL());
  }
  return cacheMascote.get(chave);
}

// "escala" sempre inteira: 3 = 192 px, 2 = 128 px, 1 = 64 px
function mascoteHTML(humor = 'normal', visual = { cor: estado.cor, usando: estado.usando }, escala = ESCALA) {

}

// quadro de dez (como no material da escola): 10 lugares por quadro; acima de 10, dois quadros
function desenhoPontinhos(n) {
  const g = Array.from({ length: 20 }, () => Array(20).fill('.'));
  const lugares = n > 10 ? 20 : 10;
  for (let k = 0; k < lugares; k++) {
    const quadro = Math.floor(k / 10), lin = Math.floor((k % 10) / 5), col = k % 5;
    const x0 = col * 4, y0 = (lugares > 10 ? 1 + quadro * 10 : 6) + lin * 4;
    const cor = k < n ? (quadro ? 'B' : 'R') : 'w';
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) if (dx === 1 || dy === 1) g[y0 + dy][x0 + dx] = cor;
  }
  return g.map(l => l.join(''));
}

      return resultados.map(res => {

// reiniciar: segurar o botão abre o menu; depois, tocar em Reiniciar (ajuda quando o aparelho trava)
function regraReiniciar(a, c, aparelho) {
  if (a === 'segurar') {
    if (c.tela === 'menu') return;
    c.mudarTela('menu');
    c.proximoPasso();
    c.msg('Isso! Agora toque em Reiniciar.');
  } else if (a === 'reiniciar') {
    c.ligarComLogo('bloqueado', () => c.acertou(`Reiniciou! O ${aparelho} desligou e ligou de novo sozinho. Isso ajuda quando ele trava.`));
  } else if (a === 'desligar') {
    c.errou('Desligar não liga de novo sozinho. Para reiniciar, toque em Reiniciar.');
  } else if (a === 'apertar') {
    c.mudarTela('bloqueado');
    c.errou('Isso só bloqueou a tela. Para reiniciar, segure o botão.');
  } else {
    c.errou('Esse botão muda o som. Use o botão de ligar.');
  }
}

// desligar celular ou tablet: segurar o botão abre o menu; depois, tocar em Desligar
function regraDesligar(a, c, aparelho) {
  if (a === 'segurar') {
    if (c.tela === 'menu') return;
    c.mudarTela('menu');
    c.proximoPasso();
    c.msg('Isso! Agora toque em Desligar.');
  } else if (a === 'apertar') {
    c.mudarTela('bloqueado');
    c.errou(`Isso só bloqueou a tela! O ${aparelho} continua ligado. Para desligar, segure o botão.`);
  } else if (a === 'desligar') {
    c.mudarTela('desligado');
    c.acertou(`Desligou! A tela apagou e o ${aparelho} está desligado de verdade.`);
  } else if (a === 'reiniciar') {
    c.ligarComLogo('bloqueado');
    c.errou('Reiniciar desliga e liga de novo. Para desligar, segure de novo e escolha Desligar.');
  } else {
    c.errou('Esse botão muda o som. Use o botão de ligar.');
  }
}

// volume: cada toque muda um nível; acerta quando chega no alvo (0 = sem som, 5 = máximo)
function regraVolume(a, c, alvo) {
  if (a === 'mais' || a === 'menos') {
    const v = c.mudarVolume(a === 'mais' ? 1 : -1);
    if (v === alvo) c.acertou(alvo === 0 ? 'Sem som! O botão de baixo diminui o som.' : alvo === 5 ? 'Som no máximo! O botão de cima aumenta o som.' : 'Som no meio: nem alto, nem baixo!');
    else if ((a === 'mais') !== (alvo > c.volume)) c.errou(a === 'mais' ? 'Esse botão aumenta o som. Use o outro!' : 'Esse botão diminui o som. Use o outro!');
  } else {
    c.errou('Esse é o botão de ligar. O som fica nos botões pequenos.');
  }
}

const DIRECOES_MAPA = {   // [linha, coluna]; nome para o leitor de tela e nome do ponto cardeal
  cima: { d: [-1, 0], nome: 'Para cima', cardeal: 'Norte', letra: 'N' },

};
// monta um mapa com o mascote, o destino e obstáculos, sempre com caminho possível.
// comParada (Difícil): também sorteia um lugar onde o mascote precisa passar antes do destino.
function gerarMapa(N, obstaculos, comParada = false, fase = FASES_MAPA[0]) {
  // menor caminho (busca em largura) de "de" até "ate", andando só onde "pode" deixar
  const menorCaminho = (tipo, de, ate, pode) => {
    const dist = Array.from({ length: N }, () => Array(N).fill(-1));
    dist[de[0]][de[1]] = 0;
    const fila = [de];
    while (fila.length) {
      const [r, c] = fila.shift();
      for (const { d: [dr, dc] } of Object.values(DIRECOES_MAPA)) {
        const a = r + dr, b = c + dc;
        if (a < 0 || b < 0 || a >= N || b >= N || dist[a][b] >= 0 || !pode(a, b)) continue;
        dist[a][b] = dist[r][c] + 1;
        fila.push([a, b]);
      }
    }
    return dist[ate[0]][ate[1]];
  };
  for (;;) {
    const tipo = Array.from({ length: N }, () => Array(N).fill(fase.chao));
    const livre = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) livre.push([r, c]);
    const sorteadas = embaralhar(livre);
    const [inicio, fim, meio] = sorteadas;
    if (Math.abs(inicio[0] - fim[0]) + Math.abs(inicio[1] - fim[1]) < N - 1) continue;   // destino longe o bastante
    const lugares = embaralhar(fase.lugares);
    const destino = lugares[0], paradaLugar = lugares[1];
    tipo[fim[0]][fim[1]] = destino.id;
    if (comParada) tipo[meio[0]][meio[1]] = paradaLugar.id;
    const outros = fase.lugares.filter(l => l.id !== destino.id && l.id !== paradaLugar.id);
    sorteadas.slice(3, 3 + obstaculos).forEach(([r, c], k) => {
      // a cada 4 obstáculos, um prédio do lugar (alternando entre os que sobraram: k = 3, 7 → 1º, 2º)
      tipo[r][c] = k % 4 === 3 ? outros[Math.floor(k / 4) % outros.length].id : fase.obstaculos[k % fase.obstaculos.length][0];
    });
    const ehGrama = (a, b) => tipo[a][b] === fase.chao;
    const igual = (p, a, b) => p[0] === a && p[1] === b;
    let passos;
    if (comParada) {
      // 1ª parte: até a parada (o destino ainda é obstáculo); 2ª parte: da parada ao destino
      const ida = menorCaminho(tipo, inicio, meio, (a, b) => ehGrama(a, b) || igual(meio, a, b));
      const volta = menorCaminho(tipo, meio, fim, (a, b) => ehGrama(a, b) || igual(meio, a, b) || igual(fim, a, b));
      if (ida < 2 || volta < 2) continue;
      passos = ida + volta;
    } else {
      passos = menorCaminho(tipo, inicio, fim, (a, b) => ehGrama(a, b) || igual(fim, a, b));
      if (passos <= 0) continue;
    }
    return { tipo, inicio, fim, destino, passos, chao: fase.chao, fase, parada: comParada ? { pos: meio, lugar: paradaLugar } : null };
  }
}

// mapa de partes de cada quadro (calculado uma vez)
function mapaDoQuadro(q) {
  if (!q.mapa) q.mapa = Array.from({ length: 36 }, (_, y) => Array.from({ length: 52 }, (_, x) => {
    let parte = -1;
    q.partes.forEach(([, teste], k) => { if (teste(x + .5, y + .5)) parte = k; });
    return parte;
  }));
  return q.mapa;
}
// as partes do quadro têm o nome da cor padrão; no Difícil, algumas são pintadas de outra cor (PARTE_DA_COR)
const PARTE_DA_COR = { laranja: 'laranja', verde: 'verde', roxo: 'roxo', rosa: 'rosa', 'azul-claro': 'azul-claro', cinza: 'cinza', 'verde-claro': 'verde', lilas: 'roxo' };
// cores: parte → cor desta partida (as partes fora da partida já vêm pintadas com a cor padrão)
function desenhoQuadro(q, pintadas, alvo, cores) {
  const mapa = mapaDoQuadro(q);
  const corDa = (k, x, y) => {
    const parte = q.partes[k][0];
    if (q.fixas[parte]) return q.fixas[parte];
    if (!cores[parte] || pintadas.includes(parte)) return CORES_MISTURA[cores[parte] || parte].letra;
    return parte === alvo ? ((x + y) % 2 ? 'W' : 'w') : 'W';     // a parte da vez fica quadriculada
  };
  return mapa.map((linha, y) => linha.map((k, x) => {
    if (k < 0) return 'K';                                          // moldura
    // borda: um vizinho é de uma parte de baixo (desenhada antes) → contorno
    const borda = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const v = mapa[y + dy]?.[x + dx];
      return v !== undefined && v >= 0 && v < k && !q.fixas[q.partes[k][0]];
    });
    return borda ? 'K' : corDa(k, x, y);
  }).join(''));
}

/* =========================================================

// fases da Balança. Cada rodada: [pesos conhecidos, menor, maior, tipo].
// Nas fases de pesos iguais, menor e maior são o valor de CADA peso que falta.
const FASES_BALANCA = [
  { id: 'falta', nome: 'Peso que falta' },   // usa as rodadas da dificuldade
  { id: 'dobro', nome: 'Dois pesos iguais', rodadas: {
    facil: [[0, 1, 5, 'dobro'], [0, 1, 5, 'dobro'], [0, 2, 5, 'dobro'], [1, 1, 4, 'dobro'], [1, 1, 4, 'dobro']],
    medio: [[0, 2, 8, 'dobro'], [1, 2, 6, 'dobro'], [1, 2, 6, 'dobro'], [2, 2, 5, 'dobro'], [2, 2, 5, 'dobro']],
    dificil: [[1, 3, 8, 'dobro'], [2, 3, 8, 'dobro'], [2, 3, 8, 'dobro'], [1, 4, 9, 'dobro'], [2, 4, 9, 'dobro']] } },
  { id: 'triplo', nome: 'Três pesos iguais', rodadas: {
