const saudacao = () => {
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia!' : h < 18 ? 'Boa tarde!' : 'Boa noite!';
};

// frase que depende do que o aluno fez: coração do dia e a última partida
function fraseDoMomento() {
  const v = vitoriasHoje(), falta = META_DIARIA - v;
  const ultima = estado.historico.at(-1);
  if (ultima && diaDe(ultima.data) === diaDe(Date.now()) && JOGOS[ultima.jogo]) {
    // compara com a partida anterior do mesmo jogo e da mesma dificuldade (elogio específico, ao esforço)
    const mesmas = estado.historico.filter(h => h.jogo === ultima.jogo && difDe(h) === difDe(ultima));
    const anterior = mesmas.at(-2);
    const { nome, artigo } = JOGOS[ultima.jogo];   // artigo: 'o' ou 'a' (no Mercadinho, na Balança)
    const em = artigo === 'a' ? 'na' : 'no';
    if (anterior && ultima.tentativas < anterior.tentativas) return `Você usou menos tentativas ${em} ${nome}! Seu treino funcionou.`;
    if (anterior && ultima.tentativas > anterior.tentativas) return `${artigo.toUpperCase()} ${nome} ficou difícil, né? Treinar de novo ajuda!`;
  }
  if (v === 0) return 'Vamos encher o coração hoje?';
  if (falta > 0) return falta === 1 ? 'Falta só 1 vitória para encher o coração!' : `Faltam ${falta} vitórias para encher o coração!`;
  return 'Coração cheio! Você pode descansar ou treinar mais.';
}

// "saco" de frases: sorteia sem repetir até usar todas, depois embaralha de novo
let sacoFrases = [];
let toquesNoMascote = 0;
function proximaFrase() {
  toquesNoMascote++;
  if (toquesNoMascote % 4 === 0) return fraseDoMomento();   // de vez em quando, lembra do coração e do treino
  if (!sacoFrases.length) sacoFrases = embaralhar(Object.values(FRASES_MASCOTE).flat());
  return sacoFrases.pop();
}

// largura e altura do palco em px; pes = altura dos pés do mascote, em px, a partir do topo do palco
function cenarioEstudo(largura, altura, pes) {
  const W = Math.ceil(largura / ESCALA_CENARIO), H = Math.ceil(altura / ESCALA_CENARIO), chao = Math.round(pes / ESCALA_CENARIO);
  const chave = `${W}x${H}x${chao}`;
  if (cacheCenario.has(chave)) return cacheCenario.get(chave);
  const tela = document.createElement('canvas');
  tela.width = W; tela.height = H;
  const ctx = tela.getContext('2d');
  const ret = (x, y, w, h, cor) => { ctx.fillStyle = cor; ctx.fillRect(x, y, w, h); };
  const px = (x, y, cor) => ret(x, y, 1, 1, cor);
  const eli = (cx, cy, rx, ry, cor, borda) => {
    for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const d = ((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2;
      if (d <= 1) px(x, y, borda && d > .78 ? borda : cor);
    }
  };
  const piso = chao - 2;   // a linha do rodapé fica logo acima dos pés
  // parede listrada, rodapé e chão de tábuas (de ponta a ponta do palco)
  ret(0, 0, W, H, '#FFF4E6');
  for (let x = 0; x < W; x += 8) ret(x, 0, 3, piso - 3, '#FFEDD5');
  ret(0, piso - 3, W, 3, '#C9874A');
  for (let y = piso; y < H; y++) for (let x = 0; x < W; x++)
    px(x, y, (y - piso) % 7 === 0 || (x + (Math.floor((y - piso) / 7) % 2) * 15) % 30 === 0 ? '#C9874A' : '#E8C08A');
  // os objetos: no desenho original (114 de largura) o chão começa em 93; aqui eles são centralizados
  ctx.save();
  ctx.translate(Math.floor((W - 114) / 2), piso - 93);
  // janela com céu e nuvem
  ret(7, 12, 32, 28, '#8C5A2B'); ret(9, 14, 28, 24, '#A5D8FF');
  eli(18, 22, 5, 2.5, '#FFFFFF'); eli(23, 21, 4, 2.5, '#FFFFFF'); eli(31, 30, 3, 1.6, '#FFFFFF');
  ret(22, 14, 2, 24, '#8C5A2B'); ret(9, 25, 28, 2, '#8C5A2B'); ret(5, 40, 36, 3, '#A9743F');
  // quadrinho com uma estrela
  ret(48, 10, 14, 12, '#FCC419'); ret(49, 11, 12, 10, '#E7F5FF');
  [[55, 13], [54, 15], [55, 15], [56, 15], [53, 16], [57, 16], [55, 17], [54, 18], [56, 18]].forEach(([x, y]) => px(x, y, '#F76707'));
  // estante com livros, cadernos e um globo
  ret(72, 34, 38, 3, '#8C5A2B'); ret(72, 58, 38, 3, '#8C5A2B');
  [[74, 10, '#E03131'], [78, 9, '#1C7ED6'], [82, 11, '#2F9E44'], [86, 8, '#FCC419'], [90, 10, '#7048E8'], [94, 9, '#F06595']]
    .forEach(([x, h, c]) => { ret(x, 34 - h, 3, h, c); ret(x, 34 - h + 2, 3, 1, '#FFFFFF'); });
  ret(99, 26, 9, 8, '#F8F9FA'); ret(100, 27, 7, 1, '#ADB5BD'); ret(100, 29, 7, 1, '#ADB5BD');
  eli(84, 50, 6, 6, '#4DABF7'); eli(82, 48, 2.5, 2, '#51CF66'); eli(86, 52, 2, 1.5, '#51CF66'); ret(83, 56, 3, 2, '#8C5A2B');
  ret(96, 47, 3, 11, '#E03131'); ret(100, 49, 3, 9, '#1C7ED6'); ret(104, 45, 3, 13, '#2F9E44');
  // planta no vaso
  eli(14, 70, 7, 9, '#2F9E44'); eli(9, 74, 4, 6, '#37B24D'); eli(19, 74, 4, 6, '#37B24D'); eli(14, 64, 3, 4, '#40C057');
  ret(8, 78, 13, 13, '#E8590C'); ret(7, 78, 15, 3, '#F76707');
  // tapete embaixo do mascote
  eli(57, 96, 38, 9, '#B197FC', '#9775FA'); eli(57, 96, 30, 6, '#D0BFFF');
  // mais embaixo, se couber: o baú e a caixa de brinquedos
  ret(6, 140, 20, 14, '#A9743F'); ret(7, 141, 18, 2, '#C9874A');
  ret(88, 146, 18, 12, '#FFFFFF'); ret(89, 147, 16, 2, '#4DABF7');
  ctx.restore();
  const url = tela.toDataURL();
  if (cacheCenario.size > 20) cacheCenario.clear();
  cacheCenario.set(chave, url);
  return url;
}
// põe o cenário no palco da tela inicial, com o chão nos pés do mascote
function ajustarCenario(palco) {
  const img = $('#mascote img', palco);
  if (!palco.isConnected || !img) return;
  const p = palco.getBoundingClientRect(), m = img.getBoundingClientRect();
  if (!p.width || !m.height) return;
  const pes = m.top + m.height * (62 / 64) - p.top;   // os pés do mascote ficam na linha 62 do desenho de 64
  const url = cenarioEstudo(p.width, p.height, pes);
  palco.style.backgroundImage = `url(${url})`;
  palco.style.backgroundSize = `${Math.ceil(p.width / ESCALA_CENARIO) * ESCALA_CENARIO}px ${Math.ceil(p.height / ESCALA_CENARIO) * ESCALA_CENARIO}px`;
}

// faz as notícias passarem da direita para a esquerda, uma de cada vez.
// Se o aparelho pede menos movimento, cada notícia aparece parada e troca a cada 7 segundos.
const MENOS_MOVIMENTO = window.matchMedia('(prefers-reduced-motion: reduce)');
const TEMPO_NOTICIA_PARADA = 7000;

function rodarNoticias() {
  const minhaPartida = partida;
  let ultima = -1;
  const proxima = () => {
    const el = $('#noticia');
    if (minhaPartida !== partida || !el) return;
    const lista = noticiasDeHoje();
    let i;
    do { i = sortear(0, lista.length - 1); } while (i === ultima && lista.length > 1);
    ultima = i;
    el.textContent = lista[i];
    const parada = MENOS_MOVIMENTO.matches;
    el.parentElement.classList.toggle('parada', parada);
    if (parada) { setTimeout(proxima, TEMPO_NOTICIA_PARADA); return; }
    const largura = el.parentElement.clientWidth, texto = el.scrollWidth;
    const anim = el.animate(
      [{ transform: `translateX(${largura}px)` }, { transform: `translateX(${-texto}px)` }],
      { duration: (largura + texto) / 55 * 1000, easing: 'linear' }
    );
    anim.onfinish = proxima;
  };
  proxima();
}

/* ---------- dificuldade ----------
   Cada jogo tem as regras de cada dificuldade em JOGOS[id].dificuldades.
   "Médio" é o jogo como era antes das dificuldades, por isso os recordes
   e as partidas antigas (sem o campo "dificuldade") contam como Médio. */
const DIFICULDADES = {
  facil: { nome: 'Fácil', barras: 1 },
  medio: { nome: 'Médio', barras: 2 },
  dificil: { nome: 'Difícil', barras: 3 }
};
const difDe = h => h.dificuldade || 'medio';

// três barrinhas em pixel art, como o sinal do celular: quantas estão cheias = dificuldade
function barrasDificuldade(cheias, selecionado = false) {
  const cheia = selecionado ? 'W' : 'G', vazia = selecionado ? 'b' : 'g';
  // barra n: 3 pixels de largura e n × 3 de altura, todas apoiadas na base
  const linhas = grade(11, 9, [1, 2, 3].map(n => [retangulo((n - 1) * 4, 9 - n * 3, (n - 1) * 4 + 3, 9), n <= cheias ? cheia : vazia, false]));
  return arte(linhas, 2, '', 'barras');
}
const chaveRecorde = (id, dif) => dif === 'medio' ? id : `${id}:${dif}`;

// botões Fácil / Médio / Difícil; "aoMudar" redesenha a tela
// atual: a dificuldade marcada (nos Jogos, a do app; no Progresso, a das estatísticas, que só filtra)
function seletorDificuldade(atual = estado.dificuldade, rotulo = 'Dificuldade') {
  return `<div class="dificuldade" role="radiogroup" aria-label="${rotulo}">${Object.entries(DIFICULDADES).map(([id, d]) =>
    `<button class="dif ${atual === id ? 'on' : ''}" data-dif="${id}" role="radio" aria-checked="${atual === id}">${barrasDificuldade(d.barras, atual === id)} ${d.nome}</button>`).join('')}</div>`;
}
function ligarDificuldade(main, aoMudar) {
  $$('[data-dif]', main).forEach(b => b.onclick = () => {
    estado.dificuldade = b.dataset.dif;
    salvar();
    tocar('clique');
    falar(DIFICULDADES[b.dataset.dif].nome);
    aoMudar();
  });
}

function melhoresEstrelas(id, dif) {
  return estado.historico.filter(h => h.jogo === id && difDe(h) === dif).reduce((m, h) => Math.max(m, h.estrelas), 0);
}

/* Tela Jogos no estilo de console (como a de um videogame):
   uma capa grande no meio, as vizinhas aparecendo dos lados, setas para
   passar e o título embaixo. Também dá para arrastar o dedo para os lados. */
let jogoEscolhido = 0;   // posição do jogo em destaque (continua a mesma ao voltar de uma partida)

/* ---------- fases ----------
   Cada jogo tem fases (temas): plantas, bichos do Brasil, papelaria, fundo do mar...
   A cada partida sai a próxima fase de um "saco" embaralhado, sem repetir até a
   criança ver todas; depois o saco enche de novo. As fases vistas ficam salvas. */
function escolherFase(id) {
  const fases = JOGOS[id].fases;
  if (!fases || !fases.length) return null;
  const f = estado.fases[id] = estado.fases[id] || { saco: [], vistas: [] };
  f.saco = f.saco.filter(x => fases.some(fa => fa.id === x));   // fases que saíram do jogo não voltam
  if (!f.saco.length) f.saco = embaralhar(fases.map(fa => fa.id));
  const proxima = f.saco.pop();
  const escolhida = fases.find(fa => fa.id === proxima);
  if (!f.vistas.includes(escolhida.id)) f.vistas.push(escolhida.id);
  salvar();
  return escolhida;
}
// fases que o aluno já VENCEU: abrem cartões no Caderno e contam para as conquistas
function faseVencida(id, fase) {
  return !!(estado.fases[id]?.vencidas?.includes(fase) || estado.historico.some(h => h.jogo === id && h.fase === fase));
}
const fasesVencidas = id => (JOGOS[id].fases || []).filter(f => faseVencida(id, f.id)).length;
const nomeDaFase = (id, fase) => (JOGOS[id].fases || []).find(f => f.id === fase)?.nome || fase;
const fasesVistas = id => (estado.fases[id]?.vistas || []).filter(x => (JOGOS[id].fases || []).some(fa => fa.id === x)).length;

function telaJogos(main) {
  const ids = Object.keys(JOGOS);
  const minhaPartida = partida;
  let direcao = 0;   // -1 = veio da esquerda, 1 = da direita (só para a animação)

  const capa = (k, classe) => {
    const j = JOGOS[ids[k]];
    return `<button class="capa ${classe}" data-k="${k}" style="--fundo:${j.fundo}" aria-label="${classe === 'atual' ? 'Jogar ' : ''}${j.nome}">
      ${arte(j.icone, classe === 'atual' ? 10 : 6, '')}</button>`;
  };

  const render = () => {
    const dif = estado.dificuldade, id = ids[jogoEscolhido], j = JOGOS[id];
    const rec = estado.recordes[chaveRecorde(id, dif)];
    const est = melhoresEstrelas(id, dif);
    const ant = (jogoEscolhido + ids.length - 1) % ids.length, prox = (jogoEscolhido + 1) % ids.length;
    main.innerHTML = `
      <div class="jogos-topo">
        ${botaoVoltar('sair')}
        <h2>Jogos</h2>
      </div>
      ${seletorDificuldade()}
      <p class="dica-dif">${ECONOMIA.bonusDificuldade[dif]
        ? `${spr('moeda', 1)} No ${DIFICULDADES[dif].nome}, cada vitória vale +${ECONOMIA.bonusDificuldade[dif]} moedas!`
        : 'Fácil para treinar. No Médio e no Difícil você ganha mais moedas!'}</p>
      <div class="pontos">${ids.map((_, k) => `<i class="${k === jogoEscolhido ? 'on' : ''}"></i>`).join('')}</div>
      <div class="carrossel" id="carrossel">
        <div class="capas ${direcao ? (direcao > 0 ? 'vem-direita' : 'vem-esquerda') : ''}">
          ${capa(ant, 'lado')}${capa(jogoEscolhido, 'atual')}${capa(prox, 'lado')}
        </div>
        <button class="seta-carrossel esq" id="anterior" aria-label="Jogo anterior">${arte('seta-esquerda', 3, '')}</button>
        <button class="seta-carrossel dir" id="proximo" aria-label="Próximo jogo">${arte('seta-direita', 3, '')}</button>
      </div>
      <div class="titulo-jogo">
        <b>${j.nome}</b>
        <span class="info-jogo"><span class="tag" style="background:${j.fundo}">${j.materia}</span>
          ${rec ? `<span>${arte('trofeu', 1, 'recorde')} ${rec}</span>` : ''}${est ? `<span class="estrelas-mini">${estrelasPx(est, 1)}</span>` : ''}
          ${j.fases ? `<span class="fases-vistas" aria-label="Fases que você já viu: ${fasesVistas(id)} de ${j.fases.length}">${arte('mapa-mascote', 1, '')} ${fasesVistas(id)}/${j.fases.length} fases</span>` : ''}</span>
      </div>
      <button class="btn btn-com-icone" id="jogar">${arte('play', 2, '')} Jogar</button>`;

    const passar = passo => {
      jogoEscolhido = (jogoEscolhido + passo + ids.length) % ids.length;
      direcao = passo;
      tocar('clique');
      falar(JOGOS[ids[jogoEscolhido]].nome);   // lê o nome do jogo para quem ainda lê pouco
      render();
    };
    const jogar = () => { tocar('clique'); abrirJogo(ids[jogoEscolhido]); };

    // arrastar o dedo para os lados também passa os jogos
    let xInicio = null, arrastou = false;
    const carrossel = $('#carrossel', main);
    carrossel.addEventListener('pointerdown', e => { xInicio = e.clientX; arrastou = false; });
    carrossel.addEventListener('pointerup', e => {
      if (xInicio === null) return;
      const dx = e.clientX - xInicio;
      xInicio = null;
      if (Math.abs(dx) > 40) { arrastou = true; passar(dx < 0 ? 1 : -1); }
    });
    $$('.capa', main).forEach(b => b.onclick = () => {
      if (arrastou) return;
      if (+b.dataset.k === jogoEscolhido) jogar();
      else passar(b === $('.capa.lado', main) ? -1 : 1);
    });
    $('#anterior', main).onclick = () => passar(-1);
    $('#proximo', main).onclick = () => passar(1);
    $('#jogar', main).onclick = jogar;
    $('#sair', main).onclick = () => { tocar('clique'); ir('inicio'); };
    ligarDificuldade(main, () => { direcao = 0; render(); });
  };

  // setas do teclado também funcionam (enquanto esta tela estiver aberta)
  const tecla = e => {
    if (minhaPartida !== partida) { document.removeEventListener('keydown', tecla); return; }
    if (e.key === 'ArrowLeft') $('#anterior').click();
    if (e.key === 'ArrowRight') $('#proximo').click();
  };
  document.addEventListener('keydown', tecla);
  render();
}

/* =========================================================
   COMO JOGAR
   A ideia do app é a criança descobrir sozinha, por curiosidade. Se precisar,
   o botão "?" no canto da tela do jogo abre uma demonstração animada: uma
   mãozinha em pixel art mostra onde tocar, segurar e arrastar numa versão
   pequena do jogo, e cada passo é lido em voz alta. Não conta tentativa.
   ========================================================= */
// cada passo: { texto, alvo (onde a mão vai), acao: 'tocar' | 'segurar' | 'arrastar',
//               ate (para onde arrasta), leva (uma cópia do alvo acompanha a mão),
//               antes(c) e depois(c) (o que muda na demonstração) }

  setTimeout(() => { if (b.isConnected) b.querySelector('img').src = arteURL(desenhoSino(NOTAS_MAESTRO[k].cor, false)); }, 380);
};
const somarMesaDemo = (c, v) => {
  const m = c.el('[data-d="mesa"]'), total = (+m.dataset.total || 0) + v;
  m.dataset.total = total;
  m.querySelector('b').innerHTML = precoPx(total, 2);
  m.querySelector('.d-itens').insertAdjacentHTML('beforeend', arte(desenhoDinheiro(DINHEIRO.find(d => d.v === v)), 2, ''));
};
const LETRAS_DEMO = ['ARVEM', 'PSOLT', 'GAZUR', 'BOTEI', 'ELUAN'];
const MAPA_DEMO = [['mapa-grama', 'mapa-grama', 'mapa-escola'], ['mapa-grama', 'mapa-arvore', 'mapa-agua'], ['mapa-grama', 'mapa-grama', 'mapa-grama']];
const moverMascoteDemo = (c, r, col) => { c.el('[data-d="mascote"]').style.transform = `translate(${col * 36}px, ${r * 36}px)`; };
const setaDemo = dir => `<span class="btn-direcao d-seta" data-d="${dir}"><span class="giro-${dir}">${arte(dir === 'esquerda' ? 'seta-esquerda' : 'seta-direita', 2, '')}</span></span>`;

const COMO_JOGAR = {

function abrirComoJogar(id) {
  const jogo = JOGOS[id], demo = COMO_JOGAR[id];
  if (!demo) return;
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `
    <div class="modal como-jogar" role="dialog" aria-label="Como jogar ${jogo.nome}">
      <h2 class="titulo-config">${arte(jogo.icone, 2, '')} Como jogar</h2>
      <div class="palco-demo" id="palco-demo"><div class="demo"></div><span class="mao-demo" id="mao-demo">${arte('mao', 3, '')}<i class="segurar-demo"></i></span></div>
      <p class="passo-demo" id="passo-demo" aria-live="polite"></p>
      <div class="pontos-demo">${demo.passos.map(() => '<i></i>').join('')}</div>
      <div class="botoes"><button class="btn sec" id="de-novo">${arte('repetir', 2, '')} Ver de novo</button><button class="btn" id="entendi">Entendi!</button></div>
    </div>`;
  $('#app').appendChild(fundo);
  const palco = $('#palco-demo', fundo), caixa = $('.demo', palco), mao = $('#mao-demo', fundo);
  let vez = 0;
  const esperar = ms => new Promise(r => setTimeout(r, ms));
  const ponto = sel => {
    const el = $(sel, caixa), a = el.getBoundingClientRect(), p = palco.getBoundingClientRect();
    return [a.left - p.left + a.width / 2, a.top - p.top + a.height / 2];
  };
  const moverMao = ([x, y], ms) => { mao.style.transition = `transform ${ms}ms ease-in-out`; mao.style.transform = `translate(${x}px, ${y}px)`; };
  const c = {
    el: sel => $(sel, caixa), todos: sel => $$(sel, caixa), esperar,
    // linha entre dois elementos (Conexão)
    linha: (a, b, cor) => {
      const svg = $('.d-linhas', caixa), base = svg.getBoundingClientRect();
      const A = $(a, caixa).getBoundingClientRect(), B = $(b, caixa).getBoundingClientRect();
      svg.insertAdjacentHTML('beforeend', `<line x1="${A.right - base.left}" y1="${A.top + A.height / 2 - base.top}" x2="${B.left - base.left}" y2="${B.top + B.height / 2 - base.top}" stroke="${cor}" stroke-width="5" stroke-linecap="round"/>`);
    },
    // põe um objeto numa vaga da linha do tempo
    colocar: (id, k) => { $(`[data-d="v${k}"]`, caixa).innerHTML = arte(id, 2, ''); $(`[data-d="${id}"]`, caixa).classList.add('usado'); }
  };
  const rodar = async () => {
    const minha = ++vez;
    const vivo = () => minha === vez && fundo.isConnected;
    caixa.innerHTML = demo.html();
    if (demo.antes) demo.antes(c);
    moverMao([palco.clientWidth - 28, palco.clientHeight - 20], 0);
    await esperar(300);
    for (let k = 0; k < demo.passos.length; k++) {
      if (!vivo()) return;
      const p = demo.passos[k], comeco = Date.now();
      $$('.pontos-demo i', fundo).forEach((i, n) => i.classList.toggle('on', n === k));
      $('#passo-demo', fundo).textContent = p.texto;
      falar(p.texto);
      if (p.antes) await p.antes(c);
      if (p.alvo && vivo()) {
        moverMao(ponto(p.alvo), 650);
        await esperar(700);
        if (!vivo()) return;
        if (p.acao === 'arrastar') {
          let copia = null;
          if (p.leva) {   // uma cópia do que é arrastado vai junto com a mão
            const [x, y] = ponto(p.alvo);
            copia = document.createElement('span');
            copia.className = 'fantasma-demo';
            copia.innerHTML = $(p.alvo, caixa).innerHTML;
            copia.style.left = x + 'px'; copia.style.top = y + 'px';
            palco.appendChild(copia);
          }
          mao.classList.add('aperta');
          await esperar(250);
          const [x2, y2] = ponto(p.ate);
          moverMao([x2, y2], 1000);
          if (copia) { copia.style.transition = 'left 1s ease-in-out, top 1s ease-in-out'; copia.style.left = x2 + 'px'; copia.style.top = y2 + 'px'; }
          await esperar(1050);
          mao.classList.remove('aperta');
          if (copia) copia.remove();
        } else if (p.acao === 'segurar') {
          mao.classList.add('aperta', 'segurando');
          await esperar(1400);
          mao.classList.remove('aperta', 'segurando');
        } else {
          mao.classList.add('aperta');
          tocar('clique');
          await esperar(220);
          mao.classList.remove('aperta');
        }
      }
      if (!vivo()) return;
      if (p.depois) p.depois(c);
      // tempo para ler e ouvir o passo (com a narração ligada, também espera a frase terminar)
      await esperar(Math.max(700, Math.max(1800, p.texto.length * 65) - (Date.now() - comeco)));
      if (falaAtual && vivo()) await new Promise(fim => depoisDaFala(fim, 6000));
    }
    if (vivo()) moverMao([palco.clientWidth - 28, palco.clientHeight - 20], 600);
  };
  const fechar = () => { vez++; fundo.remove(); calar(); };
  $('#de-novo', fundo).onclick = () => { tocar('clique'); rodar(); };
  $('#entendi', fundo).onclick = () => { tocar('clique'); fechar(); };
  fundo.onclick = e => { if (e.target === fundo) fechar(); };
  rodar();
}

function telaJogo(main, id) {
  const jogo = JOGOS[id];
  const dif = estado.dificuldade;   // fica fixa até o fim da partida
  const minhaPartida = partida;
  let tentativas = 0, instrucaoAtual = '';
  const fase = escolherFase(id);   // o tema desta partida (ex.: "Plantas", "Papelaria")

  main.innerHTML = `
    <div class="jogo-topo">
      ${botaoVoltar('sair', 'Sair')}
      <h2>${arte(jogo.icone, 2)} ${jogo.nome}</h2>
      <span class="pill" id="prog"></span>
      <button class="btn-icone btn-como" id="como-jogar" aria-label="Como jogar">${textoPx('?', { escala: 3, alt: '' })}</button>
    </div>
    ${fase ? `<p class="fase-nome">Fase: <b>${fase.nome}</b></p>` : ''}
    <p class="instrucao"><span id="instr"></span><button class="btn-icone peq" id="ouvir" aria-label="Ouvir instrução">${spr('som-ligado', 2, '')}</button></p>
    <div id="area" class="area-jogo"></div>
    <p id="msg" class="msg" aria-live="polite"></p>
    <div class="jogo-rodape">Tentativas: <b id="tent">0</b> · ${barrasDificuldade(DIFICULDADES[dif].barras)} ${DIFICULDADES[dif].nome}</div>`;

  const vivo = () => minhaPartida === partida;
  const ctl = {
    config: { ...jogo.dificuldades[dif], dif },   // regras desta dificuldade (quantas rodadas, palavras, cartas...)
    fase,                             // tema desta partida (JOGOS[id].fases), ou null
    depois: (ms, fn) => setTimeout(() => { if (vivo()) fn(); }, ms),
    progresso: texto => { $('#prog').textContent = texto; },
    // fala (opcional): o que a narração diz, quando é diferente do texto mostrado (texto ou lista de frases)
    instrucao: (texto, falarAgora = true, fala) => {
      instrucaoAtual = fala || texto;
      $('#instr').textContent = texto;
      if (falarAgora) falar(instrucaoAtual, { fila: true });   // espera o "Isso!" da rodada anterior terminar
    },
    tentativa: () => { tentativas++; $('#tent').textContent = tentativas; },
    msg: (texto, tipo = '', fala) => { const m = $('#msg'); m.textContent = texto; m.className = 'msg ' + tipo; if (texto) falar(fala || texto); },   // acerto, erro e dica: lidos em voz alta
    acerto: (texto, fala) => { tocar('acerto'); animarMusica(); ctl.msg(texto, 'ok', fala); },
    erro: (texto, el, fala) => {
      tocar('erro');
      ctl.msg(texto, 'erro', fala);
      if (el) { el.classList.remove('treme'); void el.offsetWidth; el.classList.add('treme'); }
    },
    aoRedimensionar: fn => { aoRedimensionar = fn; },
    // a tela de vitória espera a última fala do jogo terminar (ex.: o fato da Linha do tempo), sem cortá-la
    fim: minimo => ctl.depois(800, () => depoisDaFala(() => terminarJogo(id, tentativas, minimo, dif, fase && fase.id), 9000))
  };

  // sair no meio da partida perde o que foi feito: pergunta antes
  $('#sair').onclick = () => {
    tocar('clique');
    confirmar({
      titulo: 'Sair do jogo?',
      html: `<div class="modal-destaque">${mascoteHTML('triste', undefined, 1)}</div><p class="modal-texto">Se sair agora, você perde o que já fez nesta partida.</p>`,
      sim: 'Continuar jogando',
      nao: 'Sair',
      aoNao: () => { if (minhaPartida === partida) ir('jogos'); },
      foraFecha: true   // tocar fora da janela só fecha (continua jogando)
    });
  };
  $('#ouvir').onclick = () => falar(instrucaoAtual, { forcar: true });   // o botão de ouvir fala mesmo com a narração desligada
  $('#como-jogar').onclick = () => { tocar('clique'); abrirComoJogar(id); };   // ajuda: não conta tentativa
  jogo.iniciar($('#area'), ctl);
}

function terminarJogo(id, tentativas, minimo, dif = 'medio', fase = null) {
  // menos tentativas = mais estrelas
  const estrelas = tentativas <= minimo ? 3 : tentativas <= minimo + Math.ceil(minimo / 2) ? 2 : 1;
  const chave = chaveRecorde(id, dif);   // cada dificuldade tem o seu recorde
  const recordeAnterior = estado.recordes[chave] || 0;
  const primeira = recordeAnterior === 0;
  const novo = primeira || tentativas < recordeAnterior;
  if (novo) estado.recordes[chave] = tentativas;

  // de onde vêm as moedas (a tela de vitória mostra cada parte)
  const ganhos = {
    estrelas: ECONOMIA.moedasPorEstrelas[estrelas],
    dificuldade: ECONOMIA.bonusDificuldade[dif],
    recorde: novo ? ECONOMIA.bonusRecorde : 0,
    // esta vitória completa a meta do dia? (o histórico ainda não tem esta partida)
    meta: vitoriasHoje() === META_DIARIA - 1 ? ECONOMIA.bonusMetaDiaria : 0
  };
  const moedas = ganhos.estrelas + ganhos.dificuldade + ganhos.recorde + ganhos.meta;
  const xp = ECONOMIA.xpBase + estrelas * ECONOMIA.xpPorEstrela + ECONOMIA.xpDificuldade[dif];
  estado.moedas += moedas;
  estado.xp += xp;
  let subiu = false;
  while (estado.xp >= xpNecessario(estado.nivel)) {
    estado.xp -= xpNecessario(estado.nivel);
    estado.nivel++;
    subiu = true;
  }
  estado.historico.push({ jogo: id, dificuldade: dif, fase, tentativas, estrelas, data: Date.now() });
  if (fase) {   // guarda a fase vencida (abre o cartão dela no Caderno)
    const f = estado.fases[id] = estado.fases[id] || { saco: [], vistas: [] };
    f.vencidas = [...new Set([...(f.vencidas || []), fase])];
  }
  // o histórico guarda as últimas LIMITE_HISTORICO partidas. Com 200, a partir da 201ª vitória o Progresso parava de contar
  // e cartões do Caderno (que abrem com vitórias na matéria) fechavam de novo; 2000 partidas são dezenas de horas de jogo
  // e cabem com folga no navegador (~200 KB)
  while (estado.historico.length > LIMITE_HISTORICO) estado.historico.shift();
  salvar();

  const novasConquistas = verificarConquistas();
  ir('resultado', { novasConquistas, id, dif, tentativas, estrelas, novo, primeira, moedas, ganhos, xp, subiu, recorde: estado.recordes[chave], anterior: recordeAnterior });
}

function confete() {
  const cores = ['#FF8A3D', '#4C6EF5', '#40C057', '#FAB005', '#F06595'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('i');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = cores[i % cores.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = Math.random() * .4 + 's';
    $('#app').appendChild(c);   // dentro do "celular", não na página inteira
    setTimeout(() => c.remove(), 3800);
  }
}

// explica de onde vieram as moedas, ex.: "15 pelas estrelas · +10 do Difícil · +5 do recorde"
function detalheGanhos(d) {
  const g = d.ganhos, partes = [`${g.estrelas} pelas estrelas`];
  if (g.dificuldade) partes.push(`+${g.dificuldade} do ${DIFICULDADES[d.dif].nome}`);
  if (g.recorde) partes.push(`+${g.recorde} do recorde`);
  let txt = partes.join(' · ');
  if (g.meta) txt += `<br><b class="bonus-meta">${spr('coracao-cheio', 1, '')} +${g.meta} moedas: meta do dia cumprida!</b>`;
  return txt;
}

/* Tela de vitória: as informações aparecem uma de cada vez */
function telaResultado(main, d) {
  const titulo = d.primeira ? 'Primeira vitória!' : d.novo ? 'Novo recorde!' : d.estrelas === 3 ? 'Perfeito!' : 'Muito bem!';
  const selo = d.primeira ? `<span class="selo recorde">${arte('trofeu', 1, '')} Seu primeiro recorde!</span>`
    : d.novo ? `<span class="selo recorde">${arte('trofeu', 1, '')} Novo recorde! Antes eram ${d.anterior}</span>`
    : `<span class="selo">Seu recorde: ${d.recorde} tentativas</span>`;

  main.innerHTML = `
    <div class="resultado">
      <div class="mascote pulo">${mascoteHTML('feliz', undefined, 2)}</div>
      <h1 class="aparece" style="--d:.15s">${titulo}</h1>
      <div class="estrelas">${[1, 2, 3].map(i => `<span class="${i <= d.estrelas ? 'on' : ''}" style="animation-delay:${.4 + i * .25}s">${spr('estrela', 4, '')}</span>`).join('')}</div>
      <div class="resumo-tent aparece" style="--d:1.5s"><b>${d.tentativas}</b><span>tentativas no ${DIFICULDADES[d.dif].nome}</span><br>${selo}</div>
      <div class="premios aparece" style="--d:2.1s"><span class="pill">${spr('moeda', 2, 'moedas')} +<b id="cont-moedas">0</b></span><span class="pill">${spr('estrela', 2, '')} +${d.xp} XP</span></div>
      <p class="ganhos-det aparece" style="--d:2.1s">${detalheGanhos(d)}</p>
      <div class="hoje-result aparece" style="--d:2.4s">${spr(coracaoDoDia().sprite, 2)} Hoje: ${Math.min(vitoriasHoje(), META_DIARIA)} de ${META_DIARIA} vitórias</div>
      ${d.novasConquistas.length ? `<div class="nova-conquista aparece" style="--d:2.6s">${d.novasConquistas.map(c => `<span>${iconePx(c.icone, 2, '')} ${c.nome}</span>`).join('')}<small>Nova conquista!</small></div>` : ''}
      <div class="acoes aparece" style="--d:2.8s">
        <button class="btn" id="denovo">Jogar de novo</button>
        <button class="btn sec" id="voltar">Voltar ao mascote</button>
      </div>
    </div>`;

  const minhaPartida = partida;
  const depois = (ms, fn) => setTimeout(() => { if (minhaPartida === partida) fn(); }, ms);
  $('#denovo').onclick = () => { tocar('clique'); abrirJogo(d.id); };
  $('#voltar').onclick = () => { tocar('clique'); ir('inicio'); };

  tocar('vitoria');
  // uma frase por informação (cada uma tem o seu áudio); as conquistas novas também são lidas
  falar([titulo, `Você usou ${d.tentativas} ${d.tentativas === 1 ? 'tentativa' : 'tentativas'}.`, `E ganhou ${d.moedas} moedas!`,
    ...d.novasConquistas.map(c => `Nova conquista: ${c.nome.replace(/[.!?]+$/, '')}!`)]);
  if (d.novasConquistas.length) depois(2600, () => tocar('moeda'));
  if (d.novo || d.estrelas === 3) depois(500, confete);

  // as moedas sobem contando
  depois(2200, () => {
    const el = $('#cont-moedas');
    const passo = Math.max(1, Math.ceil(d.moedas / 15));
    let n = 0;
    const t = setInterval(() => {
      if (minhaPartida !== partida) { clearInterval(t); return; }
      n = Math.min(d.moedas, n + passo);
      el.textContent = n;
      if (n >= d.moedas) { clearInterval(t); tocar('moeda'); }
    }, 40);
  });

  if (d.subiu) {
    depois(3300, () => {
      tocar('vitoria');
      confirmar({ titulo: `Nível ${estado.nivel}!`, html: `<div class="modal-destaque">${spr('estrela', 6, '')}</div><p class="modal-texto">Veja as novidades na tela Visual.</p>`, sim: 'Oba!', esperarFala: true });
    });
  }
}

/* Personalização: primeiro prova no mascote, depois compra com confirmação */
// tela Visual: o mascote em cima e, embaixo, a grade com as capas das coleções.
// A capa mostra o mascote com o visual da coleção; tocar abre as cores e os acessórios dela.
// "Clássicos" são as cores e os acessórios de sempre.
const COLECAO_CLASSICA = { id: 'classicos', nome: 'Clássicos', texto: 'As cores e os acessórios de sempre.', fundo: '#FFF4E6' };
let colecaoAberta = null;   // null = grade de capas
let posicaoCapas = 0;       // onde a grade de capas estava (para voltar no mesmo lugar)
function telaVisual(main) {
  let prova = null;   // { tipo, id } do item que está sendo provado
  const daColecao = id => x => (id === 'classicos' ? !x.colecao : x.colecao === id);
  const visualCapa = c => c.id === 'classicos' ? { cor: 'laranja', usando: { cabeca: 'chapeu', pescoco: 'cachecol' } } : visualDaCapa(c);
  const contagem = c => {
    const lista = [...CORES.filter(daColecao(c.id)), ...ITENS.filter(daColecao(c.id))];
    return `${lista.filter(x => estado.comprados.includes(x.id)).length}/${lista.length}`;
  };
  const gradeCapas = () => `
    <h3 class="secao-titulo">Coleções</h3>
    <div class="capas-colecao">${[COLECAO_CLASSICA, ...COLECOES].map(c => `
      <button class="capa-colecao" data-col="${c.id}" style="--fundo:${c.fundo}" aria-label="Coleção ${c.nome}">
        <span class="capa-arte">${mascoteHTML('feliz', visualCapa(c), 1)}</span>
        <b>${c.nome}</b><small>${contagem(c)}</small>
      </button>`).join('')}</div>`;
  const paginaColecao = () => {
    const c = colecaoAberta === 'classicos' ? COLECAO_CLASSICA : COLECOES.find(x => x.id === colecaoAberta);
    return `
      <div class="card info-colecao" style="background:${c.fundo}"><b>${c.nome}</b><span>${c.texto}</span><small>${contagem(c)} itens</small></div>

      ${CORES.some(daColecao(c.id)) ? `<h3 class="secao-titulo">Cores</h3><div class="vitrine">${CORES.filter(daColecao(c.id)).map(x => cartao(x, 'cor')).join('')}</div>` : ''}
      <h3 class="secao-titulo">Acessórios</h3>
      <div class="vitrine">${ITENS.filter(daColecao(c.id)).map(x => cartao(x, 'item')).join('')}</div>`;
  };
  const lista = tipo => tipo === 'cor' ? CORES : ITENS;
  const itemProvado = () => prova && lista(prova.tipo).find(k => k.id === prova.id);

  const visualComProva = () => {
    const v = { cor: estado.cor, usando: { ...estado.usando } };
    const x = itemProvado();
    if (x) { if (prova.tipo === 'cor') v.cor = x.id; else vestir(v.usando, x); }
    return v;
  };

  const cartao = (x, tipo) => {
    const tem = estado.comprados.includes(x.id);
    const bloqueado = estado.nivel < x.nivel;
    const usando = tipo === 'cor' ? estado.cor === x.id : estado.usando[x.slot] === x.id;
    const provando = prova && prova.id === x.id;
    const visual = tipo === 'cor'
      ? `<span class="cor-bola" style="background:${x.hex}"></span>`
      : `<span class="emo">${x.desenho ? arte(x.desenho, 3, '') : iconeAcessorio(x)}</span>`;
    const rotulo = provando ? 'Provando' : usando ? 'Usando' : tem ? 'Usar' : bloqueado ? `${arte('cadeado', 1, 'bloqueado')} Nível ${x.nivel}` : `${spr('moeda', 1)} ${x.preco}`;
    return `<button class="item ${usando ? 'usando' : ''} ${provando ? 'provando' : ''} ${bloqueado && !tem ? 'bloq' : ''}" data-loja="${x.id}" data-tipo="${tipo}">${visual}${x.nome}<small>${rotulo}</small></button>`;
  };

  const barraProva = () => {
    const x = itemProvado();
    if (!x) return '<p class="dica-xp" style="margin-top:8px">Toque em um item para provar no mascote.</p>';
    let botao;
    if (estado.nivel < x.nivel) botao = `<button class="btn btn-com-icone" disabled>${arte('cadeado', 2, 'bloqueado')} Nível ${x.nivel}</button>`;
    else if (estado.moedas < x.preco) botao = `<button class="btn" disabled>Faltam ${x.preco - estado.moedas} ${spr('moeda', 1)}</button>`;
    else botao = '<button class="btn" id="comprar">Comprar</button>';
    return `
      <div class="barra-prova">
        <p>${x.nome}<small>${spr('moeda', 1)} ${x.preco} moedas</small></p>
        <button class="btn sec" id="tirar">Tirar</button>
        ${botao}
      </div>`;
  };

  const comprar = () => {
    const x = itemProvado(), tipo = prova.tipo;
    confirmar({
      titulo: `Comprar ${x.nome}?`,
      texto: `Vai custar ${x.preco} moedas. Você tem ${estado.moedas} moedas.`,
      fala: [`Comprar ${semPontoFinal(x.nome)}?`, `Vai custar ${x.preco} moedas.`, falaMoedas(estado.moedas)],
      sim: 'Comprar',
      nao: 'Cancelar',
      aoSim: () => {
        estado.moedas -= x.preco;
        estado.comprados.push(x.id);
        if (tipo === 'cor') estado.cor = x.id; else vestir(estado.usando, x);
        prova = null;
        salvar();
        tocar('moeda');
        aviso(`${x.nome} comprado!`);
        const novas = verificarConquistas();
        if (novas.length) setTimeout(() => avisarConquistas(novas), 2400);
        render(true);
      }
    });
  };

  const escolher = (id, tipo) => {
    const x = lista(tipo).find(k => k.id === id);
    tocar('clique');
    if (estado.comprados.includes(id)) {
      // já é seu: usa (ou tira) na hora
      prova = null;
      if (tipo === 'cor') estado.cor = id;
      else if (estado.usando[x.slot] === id) estado.usando[x.slot] = null;
      else vestir(estado.usando, x);
      salvar();
    } else {
      // ainda não é seu: só prova (tocar de novo tira a prova)
      prova = prova && prova.id === id ? null : { tipo, id };
    }
    falar(estado.comprados.includes(id) ? x.nome : [comPonto(x.nome), `Custa ${x.preco} moedas.`]);
    render(true);
  };

  const render = (pular = false) => {
    const rolagem = main.scrollTop;   // provar ou comprar não muda a posição da tela
    main.innerHTML = `
      ${colecaoAberta ? `<div class="cabecalho">${botaoVoltar('voltar-colecoes', 'Coleções')}<h2>Visual</h2>${pillMoedas()}</div>` : cabecalho('Visual', pillMoedas())}
      ${pensamentoHTML(visualComProva())}
      <div class="mascote ${pular ? 'pulo' : ''}" style="margin-top:4px">${mascoteHTML('feliz', visualComProva(), 3)}</div>
      ${barraProva()}
      ${colecaoAberta ? paginaColecao() : gradeCapas()}`;
    $$('[data-col]', main).forEach(b => b.onclick = () => {
      tocar('clique');
      posicaoCapas = main.scrollTop;   // guarda onde a grade estava
      colecaoAberta = b.dataset.col;
      falar(b.querySelector('b').textContent);
      render();
      main.scrollTop = 0;
    });
    if ($('#voltar-colecoes', main)) $('#voltar-colecoes', main).onclick = () => {
      tocar('clique');
      colecaoAberta = null;
      prova = null;
      render();
      main.scrollTop = posicaoCapas;   // volta para a mesma capa
    };
    $$('[data-loja]', main).forEach(b => b.onclick = () => escolher(b.dataset.loja, b.dataset.tipo));
    if ($('#tirar', main)) $('#tirar', main).onclick = () => { prova = null; tocar('clique'); render(); };
    if ($('#comprar', main)) $('#comprar', main).onclick = comprar;
    main.scrollTop = rolagem;
    if ($('#voltar-inicio', main)) ligarVoltar(main);
  };
  render();
}

/* Gráfico: vitórias por dia na última semana, com a linha da meta */
function graficoDias() {
  const NOMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const dias = Array.from({ length: 7 }, (_, k) => {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - (6 - k));
    return d;
  });
  const valores = dias.map(d => vitoriasNoDia(diaDe(d.getTime())));
  const W = 320, base = 122, topo = 24;
  const max = Math.max(META_DIARIA + 1, ...valores);
  const y = v => base - v / max * (base - topo);
  const passo = (W - 24) / 7, larg = 26;
  const barras = valores.map((v, k) => {
    const x = 12 + k * passo + (passo - larg) / 2;
    const cor = v >= META_DIARIA ? '#2F9E44' : '#4C6EF5';
    const nome = k === 6 ? 'Hoje' : NOMES[dias[k].getDay()];
    return `
      ${v ? `<rect x="${x}" y="${y(v)}" width="${larg}" height="${base - y(v)}" rx="5" fill="${cor}"/>
      <text x="${x + larg / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="12" font-weight="800" fill="#2B2A33">${v}</text>` : ''}
      <text x="${x + larg / 2}" y="${base + 18}" text-anchor="middle" font-size="11.5" font-weight="${k === 6 ? 800 : 600}" fill="${k === 6 ? '#2B2A33' : '#6B6A75'}">${nome}</text>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${W} 166" role="img" aria-label="Vitórias por dia na última semana: ${valores.join(', ')}. Meta: ${META_DIARIA} por dia.">
      <line x1="8" x2="${W - 8}" y1="${base}" y2="${base}" stroke="#EADFCF" stroke-width="2"/>
      <line x1="8" x2="${W - 8}" y1="${y(META_DIARIA)}" y2="${y(META_DIARIA)}" stroke="#E03131" stroke-width="1.5" stroke-dasharray="5 4"/>
      ${barras}
      <text x="8" y="160" font-size="11" fill="#6B6A75">Tracejado = meta (${META_DIARIA}) · verde = meta cumprida</text>
    </svg>`;
}

/* Progresso: simples, para o aluno e para o professor */
function telaProgresso(main) {
  let aberto = null;   // jogo com as partidas abertas
  // dificuldade das estatísticas: começa na dificuldade em que a criança está jogando e só filtra
  // (não muda a dificuldade dos jogos, que é escolhida na tela Jogos)
  let difVista = estado.dificuldade;

  const linhaJogo = (id, j, partidas) => {
    const n = partidas.length;
    let status;
    if (n === 0) status = '<span class="status nada">Ainda não jogou</span>';
    else if (n === 1) status = '<span class="status igual">Primeira partida</span>';
    else {
      const ultima = partidas[n - 1].tentativas, anterior = partidas[n - 2].tentativas;
      status = ultima < anterior ? `<span class="status melhor">${arte('seta-cima', 1, '')} Melhorou!</span>`
        : ultima === anterior ? `<span class="status igual">${arte('igual', 1, '')} Igual</span>`
        : `<span class="status pior">${arte('repetir', 1, '')} Tente de novo</span>`;
    }
    const melhor = partidas.reduce((m, x) => Math.max(m, x.estrelas), 0);

    let detalhes = '';
    if (aberto === id && n) {
      const ultimas = partidas.slice(-6);
      const max = Math.max(...ultimas.map(x => x.tentativas));
      const numeroDaPrimeira = n - ultimas.length + 1;
      detalhes = `
        <span class="barras">
          <span class="barras-tit">Tentativas nas últimas partidas (barra menor = melhor)</span>
          ${ultimas.map((x, k) => `
            <span class="barra-linha ${k === ultimas.length - 1 ? 'ultima' : ''}">
              <span>${numeroDaPrimeira + k}ª partida</span>
              <i style="width:${Math.max(8, x.tentativas / max * 100)}%"></i>
              <b>${x.tentativas}</b>
            </span>`).join('')}
        </span>`;
    }

    return `
      <button class="linha-jogo" data-abrir="${id}" aria-expanded="${aberto === id}">
        <span class="cab"><span class="ico">${arte(j.icone, 2)}</span><b>${j.nome}</b>${n ? `<span class="estrelas-mini">${estrelasPx(melhor, 1)}</span>` : ''}</span>
        <span class="info"><span>${n ? `Recorde: ${estado.recordes[chaveRecorde(id, difVista)]} tentativas · ${n} ${n === 1 ? 'partida' : 'partidas'}` : 'Abra em Jogos para começar'}</span>${status}</span>
        ${detalhes}
      </button>`;
  };

  const render = () => {
    const h = estado.historico.filter(x => JOGOS[x.jogo]);
    const totalEstrelas = h.reduce((s, x) => s + x.estrelas, 0);
    const precisa = xpNecessario(estado.nivel);
    const v = vitoriasHoje(), vida = coracaoDoDia(v);
    main.innerHTML = `
      ${cabecalho(`${spr('ampulheta', 2, '')} Progresso`)}
      <div class="card prog-nivel">
        <div class="mascote">${mascoteHTML('feliz', undefined, 1)}</div>
        <div style="flex:1">

// uma linha das Configurações: ligar/desligar e, embaixo, o volume de 0 a 10
function opcaoDeSom(tipo, nome, icone) {
  const n = nivelVolume(tipo), ligado = estado[tipo];
  return `<div class="bloco-som ${ligado ? '' : 'desligado'}">
    <div class="linha-opcao"><span class="rotulo-opcao">${spr(icone, 2, '')} ${nome}</span><button class="toggle ${ligado ? 'on' : ''}" data-t="${tipo}" aria-pressed="${!!ligado}" aria-label="Ligar ou desligar ${nome.toLowerCase()}"></button></div>
    <div class="linha-volume" data-tipo="${tipo}" role="group" aria-label="Volume ${tipo === 'som' ? 'dos' : 'da'} ${nome.toLowerCase()}: ${n} de 10">
      <button class="btn-vol" data-vol="${tipo}" data-passo="-1" aria-label="Diminuir o volume">${textoPx('-', { escala: 3, alt: '' })}</button>
      <span class="barra-vol">${Array.from({ length: 10 }, (_, k) => `<button class="${k < n ? 'on' : ''}" data-nivel="${k + 1}" aria-label="Volume ${k + 1}" style="height:${8 + k * 2}px"></button>`).join('')}</span>
      <button class="btn-vol" data-vol="${tipo}" data-passo="1" aria-label="Aumentar o volume">${textoPx('+', { escala: 3, alt: '' })}</button>
    </div>
  </div>`;
}
function abrirConfig() {
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  let confirmarApagar = false;
  const render = () => {
    // o redesenho troca os botões: guarda qual tinha o foco (teclado) para devolvê-lo ao mesmo botão no fim
    const a = fundo.contains(document.activeElement) ? document.activeElement : null;
    const focado = !a ? null : a.id ? `#${a.id}` : a.dataset.t ? `[data-t="${a.dataset.t}"]`
      : a.dataset.vol ? `[data-vol="${a.dataset.vol}"][data-passo="${a.dataset.passo}"]`
      : a.dataset.nivel ? `[data-tipo="${a.closest('[data-tipo]').dataset.tipo}"] [data-nivel="${a.dataset.nivel}"]` : null;
    fundo.innerHTML = `
      <div class="modal" role="dialog" aria-label="Configurações" tabindex="-1">
        <h2 class="titulo-config">${spr('engrenagem', 2, '')} Configurações</h2>
        ${opcaoDeSom('musica', 'Música', estado.musica && nivelVolume('musica') ? 'musica' : 'musica-desligada')}
        ${opcaoDeSom('som', 'Sons', estado.som && nivelVolume('som') ? 'som-ligado' : 'som')}
        ${opcaoDeSom('voz', 'Narração', estado.voz && nivelVolume('voz') ? 'balao' : 'balao-desligado')}
        <button class="btn sec btn-com-icone" id="ver-video">${arte('video', 2, '')} Vídeo de ajuda</button>
        <button class="btn sec" id="rever">Ver a apresentação de novo</button>
        <button class="btn sec" id="apagar" style="color:var(--vermelho)">${confirmarApagar ? 'Toque de novo para apagar tudo' : 'Apagar progresso'}</button>
        <button class="btn btn-fechar" id="fechar">${portaHTML(2)} Fechar</button>
        <p class="sobre">Educatata · Experiência Criativa · PUCPR</p>
      </div>`;
    $$('[data-t]', fundo).forEach(b => b.onclick = () => {
      estado[b.dataset.t] = !estado[b.dataset.t];
      salvar();
      if (b.dataset.t === 'voz') { if (estado.voz) { prepararVoz('inicio'); falar('Narração ligada.'); } else calar(); }
      if (b.dataset.t === 'musica') {
        if (estado.musica) definirMusica(musicaDesejada, true); else pararMusica();
      }
      render();
      tocar('clique');
    });
    // volume: botões - e + ou toque direto num tracinho da barra
    const mudarVolume = (tipo, nivel) => {
      estado.volumes = { ...PADRAO_VOLUME, ...estado.volumes, [tipo]: Math.max(0, Math.min(10, nivel)) };
      salvar();
      if (tipo === 'musica') abafarMusica(falando);   // a música muda na hora
      render();
      if (tipo === 'som') tocar('clique');
      if (tipo === 'voz') falar(nivelVolume('voz') ? 'Assim está bom?' : '');
    };
    $$('[data-vol]', fundo).forEach(b => b.onclick = () => mudarVolume(b.dataset.vol, nivelVolume(b.dataset.vol) + +b.dataset.passo));
    $$('[data-nivel]', fundo).forEach(b => b.onclick = () => mudarVolume(b.closest('[data-tipo]').dataset.tipo, +b.dataset.nivel));
    $('#ver-video', fundo).onclick = () => { fundo.remove(); ir('ajuda'); };
    $('#rever', fundo).onclick = () => { fundo.remove(); ir('onboarding'); };
    $('#apagar', fundo).onclick = () => {
      if (!confirmarApagar) { confirmarApagar = true; render(); return; }
      // zera o jogo, mas mantém a apresentação como vista e as escolhas de música, sons e narração
      const { som, voz, musica, dificuldade, volumes } = estado;
      estado = { ...estadoInicial(), onboarded: true, som, voz, musica, dificuldade, volumes };
      salvar();
      fundo.remove();
      ir('inicio');
      aviso('Progresso apagado.');
    };
    $('#fechar', fundo).onclick = () => sairPelaPorta($('#fechar', fundo), fechar);
    if (focado) { const el = $(focado, fundo); if (el) el.focus({ preventScroll: true }); }
  };
  // fechar as Configurações para a leitura delas (a voz não continua na tela de trás)
  const fechar = () => { fundo.remove(); calar(); };
  fundo.onclick = e => { if (e.target === fundo) fechar(); };
  render();
  $('#app').appendChild(fundo);
  falar('Configurações. Aqui você liga ou desliga a música, os sons e a narração.');
}

function recordesBatidos() {   // partidas que bateram um recorde que já existia
  const melhor = {};
  let n = 0;
  for (const h of estado.historico) {
    const chave = `${h.jogo}:${difDe(h)}`;
    if (melhor[chave] !== undefined && h.tentativas < melhor[chave]) n++;
    melhor[chave] = Math.min(melhor[chave] ?? Infinity, h.tentativas);
  }
  return n;
}

const alvoDe = c => typeof c.alvo === 'function' ? c.alvo() : c.alvo;

// confere todas; guarda a data das que acabaram de ser ganhas e devolve essas
function verificarConquistas() {
  const novas = CONQUISTAS.filter(c => !estado.conquistas[c.id] && c.valor() >= alvoDe(c));
  novas.forEach(c => { estado.conquistas[c.id] = Date.now(); });
  if (novas.length) salvar();
  return novas;
}
// na fala, uma frase por conquista (cada uma tem o seu áudio); muitas de uma vez viram um resumo
const avisarConquistas = novas => {
  if (!novas.length) return;
  tocar('moeda');
  aviso(`Nova conquista: ${novas.map(c => semPontoFinal(c.nome)).join(', ')}!`,
    novas.length > 3 ? ['Você ganhou várias conquistas novas!', 'Veja na tela Conquistas.'] : novas.map(c => `Nova conquista: ${semPontoFinal(c.nome)}!`));
};

function telaConquistas(main) {
  verificarConquistas();   // pega também as que já valiam antes desta versão do app
  const ganhas = CONQUISTAS.filter(c => estado.conquistas[c.id]).length;
  main.innerHTML = `
    ${cabecalho(`${arte('trofeu', 2, '')} Conquistas`)}
    <div class="card resumo-conquistas"><b>${ganhas} de ${CONQUISTAS.length}</b><div class="barra-grande"><span style="width:${Math.round(ganhas / CONQUISTAS.length * 100)}%"></span></div></div>
    <div class="medalhas">${CONQUISTAS.map(c => {
      const tem = !!estado.conquistas[c.id];
      const v = Math.min(c.valor(), alvoDe(c));
      return `<button class="medalha ${tem ? 'ganha' : ''}" data-c="${c.id}" aria-label="${c.nome}: ${tem ? 'ganha' : `${v} de ${alvoDe(c)}`}">

        ${tem ? '' : `<span class="mini-barra"><i style="width:${v / alvoDe(c) * 100}%"></i></span>`}
      </button>`;
    }).join('')}</div>`;
  $$('[data-c]', main).forEach(b => b.onclick = () => {
    const c = CONQUISTAS.find(x => x.id === b.dataset.c), quando = estado.conquistas[c.id];
    tocar('clique');

  });
  ligarVoltar(main);
}

const INTERVALOS_REVISAO = [1, 3, 7, 14, 30];   // dias até a próxima revisão, crescendo a cada revisão boa
// cartões gerais abrem com vitórias na matéria (o k-ésimo com k vitórias);
// cartões de fase ("jogo:fase") abrem quando o aluno vence aquela fase: o Caderno guarda o que ele aprendeu
function cartaoAberto(m, c) {
  if (c.fase) { const [j, f] = c.fase.split(':'); return faseVencida(j, f); }
  return CONHECIMENTOS[m].filter(x => !x.fase).indexOf(c) < vitoriasNaMateria(m);
}
function comoAbrirCartao(m, c) {
  if (c.fase) {
    const [j, f] = c.fase.split(':');
    return `Vença a fase ${nomeDaFase(j, f)} ${JOGOS[j].artigo === 'a' ? 'na' : 'no'} ${JOGOS[j].nome} para abrir.`;
  }
  const falta = CONHECIMENTOS[m].filter(x => !x.fase).indexOf(c) + 1 - vitoriasNaMateria(m);
  return `Vença mais ${falta} ${falta === 1 ? 'partida' : 'partidas'} de ${m} para abrir.`;
}
const abertosNaMateria = m => CONHECIMENTOS[m].filter(c => cartaoAberto(m, c));
const revisaoDaMateria = m => estado.revisoes[m] || { vezes: 0, nivel: 0, ultima: null, proxima: null };
const cartaoNovoNaMateria = m => abertosNaMateria(m).some(c => c.fase && estado.historico.some(h => `${h.jogo}:${h.fase}` === c.fase && h.data > (revisaoDaMateria(m).ultima || 0)));
const horaDeRevisar = m => abertosNaMateria(m).length > 0 && (!revisaoDaMateria(m).proxima || Date.now() >= revisaoDaMateria(m).proxima || cartaoNovoNaMateria(m));

  if (!materia) {
    // lista das matérias
    main.innerHTML = `
      ${cabecalho(`${arte('icone-livro', 2, '')} Caderno`)}
      <p class="dica-xp">Tudo o que você aprendeu nos jogos.</p>
      <div class="materias">${MATERIAS.map(m => {
        const abertos = abertosNaMateria(m.nome).length, total = CONHECIMENTOS[m.nome].length;
        return `<button class="materia-card" data-m="${m.nome}" style="--fundo:${m.fundo}">
          ${arte(m.icone, 3, '')}<b>${m.nome}</b><small>${abertos} de ${total}</small>
          ${horaDeRevisar(m.nome) ? '<span class="selo-revisar">Revisar!</span>' : ''}
        </button>`;
      }).join('')}</div>`;
    $$('[data-m]', main).forEach(b => b.onclick = () => { tocar('clique'); ir('caderno', b.dataset.m); });
    ligarVoltar(main);
    return;
  }
  // página de uma matéria: cartões abertos e fechados, e o botão de revisar
  const m = MATERIAS.find(x => x.nome === materia), lista = CONHECIMENTOS[materia], abertos = abertosNaMateria(materia).length;
  const rev = revisaoDaMateria(materia);
  const proxima = rev.proxima ? Math.ceil((rev.proxima - Date.now()) / 864e5) : 0;
  main.innerHTML = `
    ${cabecalho(`${arte(m.icone, 2, '')} ${materia}`)}
    <div class="cartoes-saber">${[...lista.filter(c => cartaoAberto(materia, c)), ...lista.filter(c => !cartaoAberto(materia, c))].map(c => cartaoAberto(materia, c)
      ? `<button class="saber" data-k="${lista.indexOf(c)}">${iconePx(c.icone, 3, '')}<span>${c.texto}</span></button>`
      : `<div class="saber fechado">${arte('cadeado', 3, '')}<span>${comoAbrirCartao(materia, c)}</span></div>`).join('')}</div>
    ${abertos ? `<button class="btn btn-com-icone" id="revisar">${arte('icone-livro', 2, '')} Revisar</button>
      <p class="dica-xp">${horaDeRevisar(materia) ? 'Hora de revisar! Lembrar faz a memória ficar forte.' : `Próxima revisão em ${proxima} ${proxima === 1 ? 'dia' : 'dias'}. Pode revisar antes, se quiser!`}</p>`
      : '<p class="dica-xp">Jogue os jogos desta matéria para encher o caderno.</p>'}`;
  $$('[data-k]', main).forEach(b => b.onclick = () => falar(lista[+b.dataset.k].texto));   // tocar no cartão lê em voz alta
  if ($('#revisar', main)) $('#revisar', main).onclick = () => {
    tocar('clique');
    ir('carregando', { destino: 'revisao', dados: materia, nome: `Revisão de ${materia}`, icone: m.icone, fundo: m.fundo,
      dica: 'Lembrar é um exercício para o cérebro!' });
  };
  $('#voltar-inicio', main).onclick = () => { tocar('clique'); ir('caderno'); };   // volta para a lista do caderno
}

function telaRevisao(main, materia) {
  // até 5 perguntas: primeiro os cartões das fases vencidas que ainda não foram revisados, depois o resto
  const ultima = revisaoDaMateria(materia).ultima || 0;
  const abertos = embaralhar(abertosNaMateria(materia));
  const novos = abertos.filter(c => c.fase && estado.historico.some(h => `${h.jogo}:${h.fase}` === c.fase && h.data > ultima));
  const perguntas = [...novos, ...abertos.filter(c => !novos.includes(c))].slice(0, 5);
  let k = 0, acertos = 0;
  const render = () => {
    const p = perguntas[k];
    const opcoes = embaralhar(p.opcoes);
    main.innerHTML = `
      ${cabecalho(`${arte('icone-livro', 2, '')} Revisão`, `<span class="pill">${k + 1}/${perguntas.length}</span>`)}
      <div class="pergunta-revisao">${iconePx(p.icone, 5, '')}<b>${p.pergunta}</b></div>
      <div class="opcoes-revisao">${opcoes.map(o => `<button class="btn sec" data-o="${o}">${o}</button>`).join('')}</div>
      <p class="msg" id="msg-rev" aria-live="polite"></p>`;
    falar(p.pergunta);
    $$('[data-o]', main).forEach(b => b.onclick = () => {
      const certo = b.dataset.o === p.opcoes[0];
      $$('[data-o]', main).forEach(x => { x.disabled = true; if (x.dataset.o === p.opcoes[0]) x.classList.add('certa-rev'); });
      if (!certo) b.classList.add('errada-rev');
      if (certo) acertos++;
      tocar(certo ? 'acerto' : 'erro');
      // a explicação aparece sempre: acertando ou não, a criança revê o conhecimento
      const texto = (certo ? 'Isso! ' : 'Quase! ') + p.texto;
      $('#msg-rev', main).textContent = texto;
      $('#msg-rev', main).className = 'msg ' + (certo ? 'ok' : '');
      falar(texto);
      main.insertAdjacentHTML('beforeend', `<button class="btn" id="proxima">${k < perguntas.length - 1 ? 'Próxima' : 'Ver resultado'}</button>`);
      $('#proxima', main).onclick = () => { tocar('clique'); k++; if (k < perguntas.length) render(); else terminar(); };
    });
    ligarVoltarCaderno();
  };
  const ligarVoltarCaderno = () => { $('#voltar-inicio', main).onclick = () => { tocar('clique'); ir('caderno', materia); }; };
  const terminar = () => {
    // agenda a próxima revisão: foi bem (75% ou mais)? o intervalo cresce; senão, volta para 1 dia
    const rev = revisaoDaMateria(materia);
    const bem = acertos / perguntas.length >= .75;
    const nivel = bem ? Math.min(INTERVALOS_REVISAO.length - 1, rev.vezes ? rev.nivel + 1 : 0) : 0;
    const dias = INTERVALOS_REVISAO[nivel];
    estado.revisoes[materia] = { vezes: rev.vezes + 1, nivel, ultima: Date.now(), proxima: Date.now() + dias * 864e5 };
    salvar();
    const novas = verificarConquistas();
    const titulo = `Você lembrou de ${acertos} de ${perguntas.length}!`;
    main.innerHTML = `
      ${cabecalho(`${arte('icone-livro', 2, '')} Revisão`)}
      <div class="resultado">
        <div class="mascote pulo">${mascoteHTML(bem ? 'feliz' : 'normal', undefined, 2)}</div>
        <h1>${titulo}</h1>
        <p class="dica-xp">${bem ? 'Sua memória está forte!' : 'Revisar de novo ajuda a lembrar.'} Próxima revisão em ${dias} ${dias === 1 ? 'dia' : 'dias'}.</p>
        <div class="acoes"><button class="btn" id="ok-rev">Voltar ao caderno</button></div>
      </div>`;
    tocar(bem ? 'vitoria' : 'clique');
    falar(titulo);
    avisarConquistas(novas);
    $('#ok-rev', main).onclick = () => { tocar('clique'); ir('caderno', materia); };
    ligarVoltarCaderno();
  };
  render();
}

/* =========================================================
   CARREGANDO
   Aparece quando o app prepara algo de verdade: ao abrir um jogo ou uma
   revisão, ele desenha e guarda as imagens que vai usar. A barra mostra o
   progresso real e fica no mínimo TEMPO_CARREGANDO na tela, para não
   "piscar"; enquanto isso, uma dica curta ajuda a criança a se preparar.
   ========================================================= */
const TEMPO_CARREGANDO = 1200;
function telaCarregando(main, d) {
  const minhaPartida = partida;
  main.innerHTML = `
    <div class="carregando" role="status" aria-label="Carregando ${d.nome}">
      <div class="capa atual" style="--fundo:${d.fundo}">${iconePx(d.icone, 10, '')}</div>
      <b class="carregando-nome">${d.nome}</b>
      <div class="barra-carregando"><span id="barra-carregando"></span></div>
      <div class="mascote correndo">${mascoteHTML('feliz', undefined, 1)}</div>
      <p class="dica-carregando">${arte('icone-dica', 2, 'Dica:')} ${d.dica}</p>
    </div>`;
  // trabalho de verdade: as imagens em pixel art ainda não desenhadas e os rostos do mascote
  const tarefas = [
    ...Object.values(ARTE).map(l => () => arteURL(l)),
    ...['feliz', 'normal', 'triste', 'bravo', 'assustado', 'surpreso'].flatMap(h =>
      [false, true].map(fechado => () => quadroMascote({ cor: estado.cor, usando: estado.usando }, h, fechado)))
  ];
  const inicio = performance.now();
  let feitas = 0;
  const passo = () => {
    if (minhaPartida !== partida) return;
    const ate = performance.now() + 8;          // um pouquinho por quadro, para a animação não travar
    while (feitas < tarefas.length && performance.now() < ate) tarefas[feitas++]();
    const progresso = Math.min(feitas / tarefas.length, (performance.now() - inicio) / TEMPO_CARREGANDO);
    $('#barra-carregando', main).style.width = Math.round(progresso * 100) + '%';
    if (progresso >= 1) { ir(d.destino, d.dados); return; }
    setTimeout(passo, 16);   // um timer (e não requestAnimationFrame), que segue andando mesmo se o navegador segurar os quadros
  };
  passo();
}
// abre um jogo passando pela tela de carregando
const abrirJogo = id => ir('carregando', { destino: 'jogo', dados: id, nome: JOGOS[id].nome, icone: JOGOS[id].icone, fundo: JOGOS[id].fundo, dica: JOGOS[id].dica });

const TELAS = {
  onboarding: telaOnboarding,
  ajuda: telaAjuda,
  inicio: telaInicio,
  jogos: telaJogos,
  jogo: telaJogo,
  resultado: telaResultado,
  visual: telaVisual,
  progresso: telaProgresso,
  conquistas: telaConquistas,
  caderno: telaCaderno,
  revisao: telaRevisao,
  carregando: telaCarregando
};

/* =========================================================
   INÍCIO DO APP
   ========================================================= */
document.getElementById('icone-aba').href = SPRITES.estrela;   // ícone da aba: a estrela em pixel art
prepararIndicativos();
prepararJanelas();
ir(estado.onboarded ? 'inicio' : 'onboarding');
</script>
