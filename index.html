<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A3D">
<meta name="description" content="Educatata: aplicativo educacional gamificado com mascote e minijogos para o 2º e 3º ano do ensino fundamental.">
<title>Educatata — Aprenda jogando</title>
<link rel="icon" id="icone-aba" href="data:,">
<style>
  :root {
    --fundo: #FFF7EC;
    --card: #fff;
    --texto: #2B2A33;
    --suave: #6B6A75;
    --borda: #EADFCF;
    --prim: #FF8A3D;
    --prim-esc: #E8701F;
    --azul: #4C6EF5;
    --verde: #2F9E44;
    --verde-claro: #D3F9D8;
    --vermelho: #E03131;
    --verm-claro: #FFE3E3;
    --amarelo: #FFC933;
    --raio: 18px;
    --sombra: 0 4px 0 rgba(0, 0, 0, .08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  /* seleção: borda azul, como nos consoles, para teclado, mouse e dedo arrastando */
  :where(button:not(.mascote), a, input, select, [tabindex]):focus-visible { outline: 3px solid #4C6EF5; outline-offset: 2px; }
  /* mãozinha que toca no mascote da tela inicial: aparece ao entrar e quando o aluno fica um tempo sem tocar em nada */
  /* como o cursor dos jogos de clicar: luva branca grande, inclinada, apontando para o mascote e "clicando" */
  .mao-mascote { position: absolute; left: 64%; top: 70%; line-height: 0; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 2;
    transform: rotate(-35deg); transform-origin: 18px 2px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .25)); }
  .mao-mascote.visivel { opacity: 1; animation: clica-mascote 1.1s ease-in-out infinite; }
  @keyframes clica-mascote { 0%, 60%, 100% { transform: rotate(-35deg) translate(0, 0); } 30% { transform: rotate(-35deg) translate(0, -9px) scale(.9); } }
  /* enquanto a mão aparece, o mascote "respira" de leve, convidando para o toque */
  .palco .mascote:has(.mao-mascote.visivel) .mascote-px { animation: convida 1.1s ease-in-out infinite; }
  @keyframes convida { 30% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .mao-mascote.visivel, .palco .mascote:has(.mao-mascote.visivel) .mascote-px { animation: none; } }
  @media (hover: hover) and (pointer: fine) {
    :where(button:not(:disabled):not(.mascote), .letra):hover { outline: 3px solid #4C6EF5; outline-offset: 2px; }
  }
  .mirado { outline: 3px solid #4C6EF5 !important; outline-offset: 2px; }
  /* tem mais embaixo: setinha que pula no pé da tela quando dá para rolar */
  .mais-abaixo { position: absolute; left: 50%; bottom: 10px; z-index: 30; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%;
    background: #fff; border: 3px solid var(--texto); display: grid; place-items: center; line-height: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .15);
    opacity: 0; pointer-events: none; transition: opacity .25s; }
  .mais-abaixo.visivel { opacity: 1; pointer-events: auto; animation: pula-seta 1.2s ease-in-out infinite; }
  @keyframes pula-seta { 50% { transform: translateY(5px); } }
  @media (prefers-reduced-motion: reduce) { .mais-abaixo.visivel { animation: none; } }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #EFE6D6;
    color: var(--texto);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  h1, h2, h3, h4 { margin: 0; }

  /* ---------- estrutura (formato de celular) ---------- */
  #app {
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    background: var(--fundo);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 500px) {
    #app { height: calc(100dvh - 32px); margin: 16px auto; border-radius: 28px; box-shadow: 0 10px 40px rgba(0, 0, 0, .15); }
  }
  main { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; }

  .nivel { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .nivel-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--azul); color: #fff; font-weight: 800; border-radius: 12px; padding: 4px 10px; font-size: 14px; white-space: nowrap; }
  .barra-xp { flex: 1; height: 12px; background: #E6E0F5; border-radius: 99px; overflow: hidden; max-width: 140px; }
  .barra-xp span { display: block; height: 100%; background: linear-gradient(90deg, #69DB7C, #2F9E44); border-radius: 99px; transition: width .6s; }

  /* ---------- componentes ---------- */
  .pill { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 2px solid var(--borda); border-radius: 99px; padding: 4px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .btn-icone { width: 42px; height: 42px; border-radius: 14px; background: #fff; border: 2px solid var(--borda); display: grid; place-items: center; font-size: 18px; flex: none; }
  .btn-icone.peq { width: 34px; height: 34px; font-size: 15px; border-radius: 10px; }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: var(--raio); font-weight: 800; font-size: 17px; background: var(--prim); color: #fff; box-shadow: 0 4px 0 var(--prim-esc); transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--prim-esc); }
  .btn.sec { background: #fff; color: var(--texto); border: 2px solid var(--borda); box-shadow: 0 4px 0 var(--borda); }
  .btn:disabled { opacity: .5; }
  .card { background: var(--card); border: 2px solid var(--borda); border-radius: var(--raio); padding: 14px; }
  .secao-titulo { font-size: 16px; margin: 16px 0 8px; }

  /* ---------- mascote ---------- */
  .mascote { display: block; margin: 0 auto; width: max-content; line-height: 0; }
  .mascote-px { display: block; animation: respira-px 1.6s steps(1) infinite; }
  @keyframes respira-px { 50% { transform: translateY(3px); } }
  .pulo { animation: pulo .55s ease; }
  @keyframes pulo { 30% { transform: translateY(-28px) scale(.95, 1.05); } 60% { transform: translateY(0) scale(1.06, .94); } }
  .flutua { animation: flutua 2.4s ease-in-out infinite; }
  @keyframes flutua { 50% { transform: translateY(-8px); } }
  .balao { position: relative; background: #fff; border: 2px solid var(--borda); border-radius: 18px; padding: 10px 16px; font-weight: 700; text-align: center; margin: 0 auto 8px; max-width: 270px; }
  .balao::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 16px; height: 16px; background: #fff; border-right: 2px solid var(--borda); border-bottom: 2px solid var(--borda); transform: translateX(-50%) rotate(45deg); }

  /* ---------- apresentação ---------- */
  .onb { flex: 1; display: flex; flex-direction: column; text-align: center; gap: 14px; padding-top: 8px; }
  .onb-topo { align-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .onb-topo .onb-pular { align-self: auto; }
  .onb-ouvir { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--texto); padding: 6px 12px; border: 2px solid var(--borda); border-radius: 99px; background: #fff; }
  .onb-ouvir.on { border-color: var(--prim); background: #FFF4E6; }
  .onb-pular { align-self: flex-end; font-weight: 700; color: var(--suave); padding: 8px 14px; border: 2px solid var(--borda); border-radius: 99px; background: #fff; }
  .onb-ilustra { flex: 1; display: grid; place-items: center; min-height: 220px; }
  .onb h1 { font-size: 26px; }
  .onb p { color: var(--suave); font-size: 17px; margin: 0 12px; }
  .pontos { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
  .pontos i { width: 10px; height: 10px; border-radius: 99px; background: var(--borda); transition: .3s; }
  .pontos i.on { width: 28px; background: var(--prim); }
  .ilustra-jogos { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
  .ilustra-jogos span { background: #fff; border: 2px solid var(--borda); border-radius: 18px; height: 72px; display: grid; place-items: center; }

  /* ---------- início ---------- */
  .chao { display: block; margin-top: -18px; }   /* sombra em pixel art embaixo do mascote */
  .dica-xp { text-align: center; color: var(--suave); font-weight: 700; font-size: 14px; margin: 0; }

  /* ---------- jogos: carrossel no estilo de console ---------- */
  .jogos-topo { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
  .jogos-topo h2 { font-size: 24px; }
  .carrossel { position: relative; overflow: hidden; margin: 4px -16px 0; padding: 10px 0; touch-action: pan-y; }
  .capas { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .capa { flex: none; display: grid; place-items: center; background: var(--fundo); border: 4px solid var(--texto); border-radius: 6px; line-height: 0; }
  .capa.atual { width: 200px; height: 220px; outline: 5px solid var(--azul); outline-offset: 3px; box-shadow: 0 8px 0 rgba(0, 0, 0, .12); }
  .capa.lado { width: 130px; height: 150px; opacity: .55; }
  .vem-direita .capa { animation: vem-direita .25s ease-out; }
  .vem-esquerda .capa { animation: vem-esquerda .25s ease-out; }
  @keyframes vem-direita { from { transform: translateX(60px); } }
  @keyframes vem-esquerda { from { transform: translateX(-60px); } }
  .seta-carrossel { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 99px; background: var(--azul); border: 3px solid var(--texto); display: grid; place-items: center; line-height: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
  .seta-carrossel.esq { left: 10px; }
  .seta-carrossel.dir { right: 10px; }
  .titulo-jogo { text-align: center; margin: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .titulo-jogo b { font-size: 22px; background: #fff; border: 2px solid var(--borda); border-radius: 99px; padding: 6px 22px; }
  .info-jogo { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--suave); }
  .info-jogo span { display: inline-flex; align-items: center; gap: 4px; }
  .info-jogo { flex-wrap: wrap; justify-content: center; }
  .fase-nome { text-align: center; color: var(--suave); font-size: 13px; font-weight: 700; margin: 2px 0 -4px; }
  .fase-nome b { color: var(--texto); }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
  .estrelas-mini { display: inline-flex; gap: 2px; }
  .estrela-px { line-height: 0; }
  .estrela-px.apagada img, .estrelas span:not(.on) img { filter: grayscale(1) opacity(.35); }
  .status { display: inline-flex; align-items: center; gap: 4px; }
  .modal-destaque { text-align: center; line-height: 0; }

  /* escolha da dificuldade: Fácil / Médio / Difícil */
  .dificuldade { display: flex; gap: 4px; background: #fff; border: 2px solid var(--borda); border-radius: 99px; padding: 4px; margin-bottom: 12px; }
  .dif { flex: 1; border-radius: 99px; padding: 9px 4px; font-weight: 800; font-size: 15px; min-height: 42px; }
  .dif.on { background: var(--azul); color: #fff; }
  .dif, .jogo-rodape { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .jogo-rodape { display: flex; }
  .btn-com-icone { display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* ---------- tela de jogo ---------- */
  .jogo-topo { display: flex; align-items: center; gap: 10px; padding-top: 6px; }
  .btn-como { width: 38px; height: 38px; border-radius: 50%; background: var(--amarelo); border-color: var(--texto); line-height: 0; }
  /* como jogar: demonstração animada */
  .como-jogar { max-width: 360px; }
  .palco-demo { position: relative; background: var(--fundo); border: 2px solid var(--borda); border-radius: 16px; padding: 12px 8px; min-height: 200px; overflow: hidden; }
  .demo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mao-demo { position: absolute; left: 0; top: 0; margin: -3px 0 0 -15px; pointer-events: none; z-index: 5; line-height: 0; }
  .mao-demo img { transition: transform .12s; transform-origin: 15px 3px; }
  .mao-demo.aperta img { transform: scale(.82); }
  .segurar-demo { display: none; position: absolute; left: 0; top: 40px; width: 40px; height: 6px; background: var(--borda); border-radius: 3px; overflow: hidden; }
  .mao-demo.segurando .segurar-demo { display: block; }
  .mao-demo.segurando .segurar-demo::after { content: ''; display: block; height: 100%; width: 0; background: var(--verde); animation: encher-demo 1.2s linear forwards; }
  @keyframes encher-demo { to { width: 100%; } }
  .fantasma-demo { position: absolute; z-index: 4; pointer-events: none; transform: translate(-50%, -50%); line-height: 0; opacity: .9; }
  .passo-demo { text-align: center; font-weight: 800; min-height: 44px; margin: 0; }
  .pontos-demo { display: flex; gap: 6px; justify-content: center; }
  .pontos-demo i { width: 8px; height: 8px; border-radius: 50%; background: var(--borda); }
  .pontos-demo i.on { background: var(--prim); }
  .d-linha { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .d-centro { text-align: center; line-height: 0; }
  .d-btn { background: #fff; border: 2px solid var(--borda); border-radius: 10px; padding: 6px 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; line-height: 1.1; }
  .d-btn.verde { background: var(--prim); color: #fff; border-color: var(--prim-esc); }
  .d-btn.on, .d-btn.verde.on { background: var(--verde-claro); border-color: var(--verde); color: var(--verde); }
  .demo .marcado { outline: 3px solid var(--prim); outline-offset: 1px; }
  .demo .riscado { text-decoration: line-through; opacity: .55; }
  .d-grade { display: grid; grid-template-columns: repeat(5, 28px); gap: 2px; }
  .d-letra { width: 28px; height: 28px; display: grid; place-items: center; background: #fff; border-radius: 6px; line-height: 0; }
  .d-letra.achada { background: #FFD8A8; }
  .d-conexao { position: relative; display: flex; gap: 40px; }
  .d-col { display: flex; flex-direction: column; gap: 14px; }
  .d-linhas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .d-memoria { grid-template-columns: repeat(4, 62px); }
  .d-memoria .frente { font-size: 12px; font-weight: 800; }
  .d-mesa { width: 230px; min-height: 64px; border: 3px dashed #E8C08A; border-radius: 12px; background: #FFF4E6; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; }
  .d-mesa small { font-weight: 800; color: var(--suave); }
  .d-itens { display: flex; gap: 4px; line-height: 0; }
  .d-din { line-height: 0; }
  .d-num { min-width: 48px; justify-content: center; }
  .d-aparelho { gap: 30px; align-items: flex-end; }
  .d-cabo { line-height: 0; }
  .d-celular { position: relative; width: 86px; height: 150px; background: var(--texto); border-radius: 14px; display: block; }
  .d-tela { position: absolute; left: 7px; right: 7px; top: 12px; bottom: 18px; background: #A5D8FF; border-radius: 4px; display: grid; place-items: center; line-height: 0; }
  .d-tela.bloqueada { background: #364FC7; }
  .d-tela.apagada { background: #111; }
  .d-menu { font-size: 12px; padding: 4px 6px; }
  .d-botao { position: absolute; right: -6px; top: 34px; width: 6px; height: 22px; background: #6B6A75; border-radius: 0 3px 3px 0; }
  .d-entrada { position: absolute; left: 36px; bottom: 4px; width: 14px; height: 6px; background: #6B6A75; border-radius: 2px; }
  .d-tempo small { font-weight: 800; color: var(--suave); }
  .d-tempo i { font-style: normal; color: var(--suave); }
  .d-vaga { width: 42px; height: 42px; border: 2px dashed var(--borda); border-radius: 8px; display: grid; place-items: center; line-height: 0; background: #fff; }
  .d-objeto { flex-direction: column; font-size: 12px; }
  .d-objeto.usado { visibility: hidden; }
  .d-mapa { position: relative; display: grid; grid-template-columns: repeat(3, 36px); line-height: 0; border: 3px solid var(--texto); }
  .d-mascote { position: absolute; left: 0; top: 0; transition: transform .35s; }
  .d-seta { width: 48px; height: 40px; }
  .d-pote { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 800; line-height: 1.2; }
  .d-amostra { width: 18px; height: 18px; border-width: 2px; }
  .d-sol { width: 36px; height: 36px; border-radius: 50%; border: 3px dashed var(--texto); background: #fff; display: inline-block; }
  .d-sol.pintado { background: #F76707; border-style: solid; }
  .d-fala { font-size: 15px; }
  .jogo-topo h2 { flex: 1; text-align: center; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  /* celular estreito (320 px): nomes longos ("Jogo da memória") empurravam o botão "?" para fora da tela */
  @media (max-width: 360px) { .jogo-topo { gap: 6px; } .jogo-topo h2 { min-width: 0; font-size: 16px; } .jogo-topo h2 img { display: none; } }
  .instrucao { text-align: center; color: var(--suave); font-weight: 700; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .area-jogo { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .msg { text-align: center; font-weight: 800; min-height: 24px; margin: 8px 0 0; }
  .msg.ok { color: var(--verde); }
  .msg.erro { color: var(--vermelho); }
  .jogo-rodape { text-align: center; color: var(--suave); font-weight: 700; padding-top: 4px; }
  .treme { animation: treme .4s; }
  @keyframes treme { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* mercadinho */
  .prateleira { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .produto { background: #fff; border: 2px solid var(--borda); border-radius: 14px; padding: 6px; text-align: center; font-weight: 700; font-size: 13px; position: relative; }
  .produto { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .produto-nome { font-size: 12px; line-height: 1.1; }
  .pedido-linha { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .pedido-txt { display: flex; flex-direction: column; gap: 6px; }
  .pedido-rot { font-weight: 800; color: var(--suave); font-size: 14px; }
  .produto.pedido { border-color: var(--prim); background: #FFF0E3; }
  .selo-pedido { position: absolute; top: -10px; right: -8px; line-height: 0; }
  .pedido-txt { background: #fff; border-radius: 14px; padding: 10px; text-align: center; font-weight: 700; border: 2px solid var(--borda); }
  .mesa { border: 3px dashed #D9B98F; background: #FBEBD3; border-radius: 16px; min-height: 100px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; align-items: center; }
  .mesa-total { width: 100%; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  .mesa-vazia { color: #A88B66; font-weight: 700; margin: auto; display: flex; align-items: center; gap: 8px; }
  .carteira h4 { margin: 2px 0 6px; font-size: 13px; color: var(--suave); text-align: center; }
  .notas, .moedas { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  /* notas e moedas são desenhos em pixel art: o botão fica só com a imagem */
  .nota, .moeda { background: none; border: 0; padding: 0; line-height: 0; }
  .nota img, .moeda img { pointer-events: none; }
  .carteira .nota img, .carteira .moeda img { filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .15)); }
  .botoes { display: flex; gap: 10px; }

  /* balança */
  .balanca svg { width: 100%; height: auto; display: block; }
  .balanca image { image-rendering: pixelated; }
  .viga, .prato { transition: transform .7s cubic-bezier(.3, 1.5, .5, 1); }
  .equacao { text-align: center; margin: 0; line-height: 0; }
  .opcoes { display: flex; justify-content: center; gap: 12px; }
  .opcao { width: 74px; height: 74px; border-radius: 18px; background: #fff; border: 3px solid var(--borda); font-size: 28px; font-weight: 900; box-shadow: var(--sombra); }
  .opcao.certa { background: var(--verde-claro); border-color: var(--verde); }
  .opcao.errada { background: var(--verm-claro); border-color: var(--vermelho); }

  /* conexão */
  .conexao { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; row-gap: 16px; margin-top: 8px; }
  .conexao svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .palavra { background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: 16px 6px; font-weight: 800; font-size: 16px; box-shadow: var(--sombra); position: relative; z-index: 1; }
  .palavra.sel { border-color: var(--azul); background: #EDF2FF; }
  .palavra.ok { background: var(--verde-claro); }

  /* memória */
  .memoria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; perspective: 800px; }
  .carta { aspect-ratio: 1; position: relative; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.45, .05, .25, 1); }
  .carta.virada { transform: rotateY(180deg); }
  .carta .face { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 3px solid var(--borda); box-shadow: 0 3px 0 rgba(0, 0, 0, .08); }
  .carta .verso { background: repeating-linear-gradient(45deg, #FFB27A 0 10px, #FF9F5A 10px 20px); color: #fff; font-size: 30px; font-weight: 900; border-color: var(--prim-esc); }
  .carta .frente { background: #fff; transform: rotateY(180deg); font-weight: 800; font-size: 14px; padding: 4px; text-align: center; }
  .carta .frente img { max-width: 80%; height: auto; }
  .memoria.quatro .frente { font-size: 12px; padding: 2px; }   /* 4 colunas: cartas menores, nomes como "Retângulo" ainda cabem */
  .carta.achada .frente { border-color: var(--verde); background: var(--verde-claro); }

  /* caça-palavras */
  .caca { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .letra { aspect-ratio: 1; display: grid; place-items: center; background: #fff; border: 2px solid var(--borda); border-radius: 8px; font-weight: 900; font-size: clamp(14px, 4.4vw, 19px); }
  .letra img { pointer-events: none; }   /* o toque tem que chegar na casa, não na imagem da letra */
  .letra.sel { background: #DBE4FF; box-shadow: inset 0 0 0 3px var(--azul); }
  .letra.inicio { background: var(--azul); color: #fff; }
  .letra.dica { animation: piscaDica .5s 3; }
  @keyframes piscaDica { 50% { background: var(--amarelo); } }
  .lista-palavras { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .lista-palavras span { background: #fff; border: 2px solid var(--borda); border-radius: 99px; padding: 4px 12px; font-weight: 800; }
  .lista-palavras span.achada { text-decoration: line-through; color: var(--verde); border-color: var(--verde); background: var(--verde-claro); }



  /* ---------- linha do tempo ---------- */
  .tema-tempo { text-align: center; font-weight: 900; font-size: 22px; }
  .linha-tempo { display: flex; align-items: center; justify-content: center; gap: 4px; background: #fff; border: 3px solid var(--texto); padding: 8px 6px; }
  .ponta-tempo { display: flex; flex-direction: column; align-items: center; font-weight: 800; color: var(--suave); font-size: 11px; line-height: 1.2; }
  .vaga-tempo { width: 52px; height: 52px; border: 3px dashed var(--borda); display: grid; place-items: center; line-height: 0; }
  .seta-tempo { width: 8px; height: 3px; background: var(--texto); }
  .cartas-tempo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .carta-tempo { background: #fff; border: 3px solid var(--texto); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
  .carta-tempo small { font-size: 13px; line-height: 1.1; }
  .carta-tempo.usada { opacity: .25; }
  /* ---------- caminho no mapa ---------- */
  .destino-mapa { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; }
  .mapa { position: relative; display: grid; margin: 0 auto; border: 4px solid var(--texto); line-height: 0; width: max-content; }
  .mascote-mapa { position: absolute; left: 0; top: 0; transition: transform .2s; line-height: 0; }
  /* a rosa dos ventos fica ao lado do botão N, fora do mapa: em cima do mapa ela cobria a casa do canto */
  .rosa-mapa { position: absolute; right: 0; top: 2px; line-height: 0; }
  .controle-mapa { position: relative; width: max-content; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .controle-mapa div { display: flex; gap: 6px; }
  .btn-direcao { width: 62px; height: 52px; background: var(--azul); border: 3px solid var(--texto); display: grid; place-items: center; line-height: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
  .btn-direcao:active { transform: translateY(3px); box-shadow: none; }
  .giro-cima { transform: rotate(-90deg); } .giro-baixo { transform: rotate(90deg); }
  .giro-cima, .giro-baixo, .giro-esquerda, .giro-direita { display: inline-block; line-height: 0; }
  /* ---------- maestro ---------- */
  .maestro-topo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; }
  .maestro-topo .mascote { margin: 0; }
  .aviso-som { text-align: center; color: var(--vermelho); font-weight: 800; margin: 0; }
  .sinos { display: flex; justify-content: center; gap: 8px; }
  .sino { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; line-height: 1; padding: 4px; touch-action: manipulation; min-width: 0; flex: 0 1 auto; }
  .sino img { max-width: 100%; height: auto; }   /* celular estreito (320px): os 4 sinos encolhem em vez de sair da tela */
  .sino.tocando { transform: translateY(-6px) rotate(-6deg); }
  .contas-maestro { display: flex; justify-content: center; gap: 8px; }
  .contas-maestro i { width: 16px; height: 16px; border: 3px solid var(--texto); background: #fff; }
  .contas-maestro i.on { background: var(--verde); }
  /* ---------- ateliê de cores ---------- */
  .quadro { margin: 0 auto; line-height: 0; border: 6px solid #8C5A2B; box-shadow: 0 6px 0 rgba(0, 0, 0, .15); }
  .pedido-cor, .mistura { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; }
  .amostra, .pote-vazio { width: 30px; height: 30px; border: 3px solid var(--texto); background: #fff; display: inline-block; }
  .potes { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
  .pote { display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; padding: 4px; border: 3px solid transparent; line-height: 1; }
  .pote.escolhido { border-color: var(--azul); background: #EDF2FF; }
  .pote small { font-size: 12px; }
  /* ---------- teatro de histórias ---------- */
  .livro-cena { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; }
  .fala-cena { margin: 0; text-align: center; font-weight: 800; font-size: 18px; background: #fff; border: 3px solid var(--texto); padding: 8px 10px; }
  .palco-teatro { position: relative; height: 170px; background: linear-gradient(#3B2A4A 0 78%, #8C5A2B 78% 100%); border: 4px solid var(--texto); border-top: 16px solid #C92A2A; overflow: hidden; display: flex; justify-content: center; align-items: flex-end; }
  .palco-teatro .cortina { position: absolute; top: 0; }
  .palco-teatro .cortina.esq { left: 0; }
  .palco-teatro .cortina.dir { right: 0; transform: scaleX(-1); }
  .ator { line-height: 0; margin-bottom: 8px; }
  .emocoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .emocao { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--texto); padding: 4px 4px 6px; font-weight: 800; line-height: 1; }
  .emocao small { font-size: 12px; }
  .emocao .mascote-px { animation: none; }


  /* ---------- conquistas ---------- */
  .resumo-conquistas { text-align: center; margin-bottom: 12px; }
  .resumo-conquistas b { font-size: 20px; }
  .medalhas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .medalha { display: flex; flex-direction: column; align-items: center; gap: 4px; background: #fff; border: 3px solid var(--borda); padding: 8px 4px; font-size: 12px; line-height: 1.15; }
  .medalha .disco { position: relative; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: #E9ECEF; border: 4px solid #ADB5BD; line-height: 0; }
  .medalha:not(.ganha) .disco img:first-child { filter: grayscale(1) opacity(.4); }
  .medalha.ganha { border-color: var(--amarelo); }
  .medalha.ganha .disco { background: #FFF3BF; border-color: #FAB005; box-shadow: 0 3px 0 #E0A800; }
  .tranca { position: absolute; right: -4px; bottom: -4px; background: #fff; border: 2px solid var(--texto); line-height: 0; padding: 1px; }
  .mini-barra { width: 80%; height: 6px; background: #E9ECEF; }
  .mini-barra i { display: block; height: 100%; background: var(--verde); }
  .nova-conquista { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; background: #FFF3BF; border: 3px solid #FAB005; padding: 6px 10px; font-weight: 800; }
  .nova-conquista span { display: inline-flex; align-items: center; gap: 4px; }
  .nova-conquista small { width: 100%; text-align: center; color: #8A5A00; }
  /* ---------- caderno e revisão ---------- */
  .materias { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .materia-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--fundo); border: 3px solid var(--texto); padding: 10px 4px; font-size: 14px; line-height: 1.1; }
  .materia-card small { color: var(--suave); font-weight: 700; }
  .selo-revisar { position: absolute; top: -10px; right: -6px; background: var(--vermelho); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 6px; border: 2px solid var(--texto); }
  .cartoes-saber { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .saber { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border: 3px solid var(--texto); padding: 8px 10px; font-weight: 800; font-size: 15px; line-height: 1.25; }
  .saber.fechado { background: #F1F3F5; border-style: dashed; color: var(--suave); font-weight: 700; }
  .pergunta-revisao { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-size: 20px; margin: 8px 0 14px; }
  .opcoes-revisao { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .opcoes-revisao .btn.certa-rev { background: var(--verde-claro); border-color: var(--verde); color: var(--verde); }
  .opcoes-revisao .btn.errada-rev { background: var(--verm-claro); border-color: var(--vermelho); }
  .opcoes-revisao .btn:disabled { opacity: 1; }
  /* ---------- carregando ---------- */
  .carregando { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .carregando .capa.atual { width: 170px; height: 170px; }
  .carregando-nome { font-size: 24px; }
  .barra-carregando { width: 220px; height: 18px; border: 3px solid var(--texto); background: #fff; }
  .barra-carregando span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--verde) 0 12px, #69DB7C 12px 24px); }
  .mascote.correndo .mascote-px { animation: correndo .35s steps(2) infinite; }
  @keyframes correndo { 50% { transform: translateY(-6px); } }
  .dica-carregando { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 8px; max-width: 300px; font-weight: 800; color: var(--suave); }


  /* ---------- dificuldades novas (Difícil) ---------- */
  .pistas { display: flex; flex-direction: column; gap: 6px; }
  .pista { display: flex; align-items: center; gap: 8px; text-align: left; background: #fff; border: 3px solid var(--texto); padding: 6px 8px; font-weight: 700; font-size: 14px; line-height: 1.2; }
  .pista b { flex: none; width: 24px; height: 24px; display: grid; place-items: center; background: var(--azul); color: #fff; }
  .pista.achada { background: var(--verde-claro); border-color: var(--verde); }
  .pista em { font-style: normal; font-weight: 900; color: var(--verde); }
  .conexao.dois { display: grid; grid-template-columns: 1fr 1fr; row-gap: 0; }
  .col-conexao { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
  .col-conexao .palavra { padding: 10px 6px; }
  .lados { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1; }
  .lados small { font-size: 11px; }
  .carta-texto { font-size: 14px; line-height: 1.1; padding: 2px; text-align: center; }
  .produto.escolher { border: 3px solid var(--borda); }
  .ao-contrario { display: block; font-size: 14px; color: var(--vermelho); }
  .pergunta-papel { margin: 0; text-align: center; font-weight: 900; font-size: 18px; }

  /* ---------- mundo digital ---------- */
  .tarefa-digital { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; }
  .aparelho { position: relative; margin: 4px auto 0; line-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  .tela-ap { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; background: #1B1A22; }
  .tela-inicio, .tela-volume { background: #A5D8FF; }
  .tela-bloqueado { background: #364FC7; }
  .tela-menu { background: rgba(27, 26, 34, .92); }
  .tela-bateria-fraca, .tela-carregando { background: #F8F9FA; }
  .tela-desktop, .tela-menu-pc, .tela-pasta-aberta { background: #1C7ED6; justify-content: flex-start; align-items: flex-start; }
  .apps { display: grid; grid-template-columns: repeat(3, auto); gap: 10px; }
  .menu-energia, .menu-pc { display: flex; flex-direction: column; gap: 8px; }
  .menu-pc { position: absolute; left: 4px; bottom: 34px; background: #fff; border: 3px solid var(--texto); padding: 6px; }
  .menu-pc { gap: 3px; padding: 3px; }
  .menu-pc .opcao-ap { padding: 3px 8px; font-size: 13px; border-width: 2px; }   /* a tela do monitor é baixa: menu compacto */
  .opcao-ap { display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--texto); padding: 6px 10px; font-weight: 800; font-size: 14px; line-height: 1; color: var(--texto); }
  .volume-ap { position: absolute; left: 6px; top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: #fff; border: 3px solid var(--texto); padding: 4px; }
  .niveis { display: flex; flex-direction: column-reverse; gap: 2px; }
  .niveis i { width: 14px; height: 8px; background: #DEE2E6; }
  .niveis i.on { background: var(--verde); }
  .icone-pasta { margin: 8px; line-height: 0; padding: 4px; }
  .barra-tarefas { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #DEE2E6; border-top: 3px solid var(--texto); display: flex; align-items: center; padding: 0 4px; }
  .botao-menu { line-height: 0; }
  .janela-pc { margin: 10px; background: #fff; border: 3px solid var(--texto); padding: 8px; display: flex; gap: 8px; align-items: center; line-height: 0; }
  .botao-ap { position: absolute; padding: 0; }
  .botao-ap:active { background: rgba(255, 255, 255, .35); }
  .entrada-ap { position: absolute; }
  .cabo-area { display: flex; justify-content: center; margin-top: -6px; }
  .cabo { line-height: 0; touch-action: none; }
  .destaque { animation: destaque .5s 4; outline: 4px solid var(--amarelo); outline-offset: 2px; }
  @keyframes destaque { 50% { outline-color: transparent; } }
  /* barra que enche enquanto a criança segura o botão de ligar */
  .barra-segurar { height: 10px; width: 160px; margin: 0 auto; background: #E6E0F5; border: 2px solid var(--texto); visibility: hidden; }
  .barra-segurar span { display: block; height: 100%; width: 0; background: var(--verde); }
  .barra-segurar.enchendo { visibility: visible; }
  .barra-segurar.enchendo span { animation: enche 1.2s linear forwards; }
  @keyframes enche { to { width: 100%; } }

  /* ---------- resultado ---------- */
  .resultado { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding-top: 16px; }
  .estrelas { display: flex; gap: 10px; font-size: 46px; line-height: 1; }
  .estrelas span { color: #DDD; transform: scale(0); animation: estrela .45s forwards; }
  .estrelas span.on { color: var(--amarelo); text-shadow: 0 3px 0 #E0A800; }
  @keyframes estrela { to { transform: scale(1); } }
  /* o confete fica dentro do #app, que corta o que passa da borda: no computador ele não cai fora do "celular" */
  .confete { position: absolute; top: -14px; width: 10px; height: 14px; border-radius: 2px; z-index: 50; pointer-events: none; animation: cai linear forwards; }
  @keyframes cai { to { transform: translateY(105vh) rotate(720deg); } }

  /* ---------- visual ---------- */
  .vitrine { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .item { background: #fff; border: 2px solid var(--borda); border-radius: 16px; padding: 10px 4px; text-align: center; font-weight: 800; font-size: 14px; box-shadow: var(--sombra); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .item .emo { font-size: 30px; line-height: 34px; }
  .item small { font-weight: 700; color: var(--suave); }
  .item.usando { border-color: var(--verde); background: var(--verde-claro); }
  .item.bloq { opacity: .55; }
  .cor-bola { width: 34px; height: 34px; border-radius: 99px; border: 3px solid rgba(0, 0, 0, .12); }

  /* ---------- configurações e avisos ---------- */
  .modal-fundo { position: absolute; inset: 0; background: rgba(30, 25, 20, .45); display: grid; place-items: center; z-index: 40; padding: 20px; }
  .modal[tabindex="-1"]:focus { outline: none; }   /* a janela recebe o foco ao abrir (prepararJanelas), sem contorno nela inteira */
  .modal { background: #fff; border-radius: 22px; padding: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; animation: surge .25s ease; }
  @keyframes surge { from { transform: scale(.9); opacity: 0; } }
  .linha-opcao { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  .bloco-som { display: flex; flex-direction: column; gap: 4px; }
  .linha-volume { display: flex; align-items: center; gap: 8px; padding-left: 30px; }
  .btn-vol { width: 34px; height: 30px; border-radius: 10px; background: #fff; border: 2px solid var(--borda); display: grid; place-items: center; line-height: 0; flex: none; }
  .barra-vol { flex: 1; display: flex; align-items: flex-end; gap: 3px; height: 28px; }
  .barra-vol button { flex: 1; background: var(--borda); border-radius: 2px; padding: 0; min-width: 0; }
  .barra-vol button.on { background: var(--prim); }
  .bloco-som.desligado .linha-volume { opacity: .4; }
  .modal { max-height: calc(100% - 10px); overflow-y: auto;
    background: linear-gradient(#fff 30%, rgba(255, 255, 255, 0)) top, linear-gradient(rgba(255, 255, 255, 0), #fff 70%) bottom,
      radial-gradient(farthest-side at 50% 0, rgba(0, 0, 0, .22), transparent) top, radial-gradient(farthest-side at 50% 100%, rgba(0, 0, 0, .22), transparent) bottom;
    background-color: #fff; background-repeat: no-repeat; background-size: 100% 40px, 100% 40px, 100% 16px, 100% 16px; background-attachment: local, local, scroll, scroll; }
  .toggle { width: 56px; height: 32px; border-radius: 99px; background: #DDD; position: relative; transition: .2s; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 99px; background: #fff; transition: .2s; }
  .toggle.on { background: var(--verde); }
  .toggle.on::after { left: 28px; }
  .sobre { font-size: 12px; color: var(--suave); text-align: center; margin: 0; }
  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; z-index: 60; animation: toast 2.2s forwards; max-width: 90%; text-align: center; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

  .modal-texto { margin: 0; color: var(--suave); font-weight: 600; line-height: 1.45; }
  .modal .botoes .btn { padding: 13px 10px; font-size: 16px; }

  /* ---------- vídeo de ajuda ---------- */
  .video-caixa { width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #2B2A33; flex: none; }
  .video-caixa video { width: 100%; height: 100%; display: block; }
  /* vídeo em pé: a altura acompanha a tela, para caber junto com o resto da apresentação */
  .video-caixa.vertical { aspect-ratio: 9 / 16; width: auto; height: clamp(200px, calc(100dvh - 398px), 540px); align-self: center; }
  /* troca entre o vídeo sem Libras (em pé) e o com Libras (deitado) */
  .troca-video { margin-top: -6px; padding: 4px 12px; font-size: 14px; }
  .video-falso { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; background: linear-gradient(135deg, #4C6EF5, #845EF7); font-weight: 700; }
  .video-falso .play { width: 64px; height: 64px; border-radius: 99px; background: rgba(255, 255, 255, .25); display: grid; place-items: center; font-size: 26px; }
  .dicas-uso { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .dicas-uso div { background: #fff; border: 2px solid var(--borda); border-radius: 14px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 16px; }
  .modal-icone { display: flex; align-items: center; gap: 8px; }

  /* ---------- explicação da conexão ---------- */
  .explica { display: flex; flex-direction: column; gap: 10px; }
  .explica-card { background: #fff; border: 3px solid var(--c); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .explica-card b { color: var(--c); font-size: 18px; }
  .explica-card span { font-weight: 700; }
  .explica-card em { color: var(--suave); font-weight: 600; font-style: normal; }
  .link-btn { align-self: center; font-weight: 800; color: var(--azul); padding: 8px 12px; }

  /* ---------- memória: fase de memorizar ---------- */

<script>
'use strict';

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = (seletor, el = document) => el.querySelector(seletor);
const $$ = (seletor, el = document) => [...el.querySelectorAll(seletor)];
const sortear = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const embaralhar = lista => {
  const a = [...lista];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const reais = centavos => 'R$ ' + (centavos / 100).toFixed(2).replace('.', ',');
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
// estrelasPx (estrelas em pixel art) fica depois dos sprites

/* =========================================================
   ESTADO SALVO NO NAVEGADOR (localStorage)
   ========================================================= */
const CHAVE = 'appmm-web-v1';
const estadoInicial = () => ({
  onboarded: false,
  moedas: 0,
  xp: 0,
  nivel: 1,
  som: true,
  voz: false,   // a narração começa desligada: o aluno (ou o professor) liga na apresentação ou nas Configurações
  musica: true,
  cor: 'laranja',
  comprados: ['laranja'],
  // um item por lugar (não dá para usar dois cabelos ou dois colares): cabeça, rosto, pescoço (colares e gravatas),
  // roupa (jaqueta, camisas, toga, faixa), costas, lado (o que segura) e pensamento (balão)
  usando: { cabeca: null, rosto: null, pescoco: null, roupa: null, costas: null, lado: null, pensamento: null },
  dificuldade: 'medio',   // 'facil', 'medio' ou 'dificil'; vale para todos os jogos
  recordes: {},
  historico: [],
  conquistas: {},   // id da conquista → quando foi ganha
  revisoes: {},     // matéria → { vezes, nivel, ultima, proxima } (revisão espaçada do Caderno)
  fases: {},        // jogo → { saco, vistas }: as fases saem sem repetir até a criança ver todas
  volumes: { som: 8, musica: 8, voz: 10 }   // volume de 0 a 10 de cada tipo de som (Configurações)
});

function carregar() {
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE));
    if (salvo) return { ...estadoInicial(), ...salvo };
  } catch (e) { /* sem acesso ao armazenamento: começa do zero */ }
  return estadoInicial();
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* ignora */ }
}
let estado = carregar();
const xpNecessario = nivel => 30 + (nivel - 1) * 15;
const LIMITE_HISTORICO = 2000;   // partidas guardadas no histórico (veja terminarJogo)

/* =========================================================
   ECONOMIA: tudo o que o aluno ganha numa vitória.
   Para deixar o jogo mais fácil ou mais difícil de "comprar tudo",
   mude só estes números (e os preços em CORES e ITENS).
   ========================================================= */
const ECONOMIA = {
  moedasPorEstrelas: [0, 5, 10, 15],                  // posição = estrelas da partida (1, 2 ou 3)
  bonusDificuldade: { facil: 0, medio: 5, dificil: 10 },   // moedas a mais por jogar no Médio ou no Difícil
  bonusRecorde: 5,                                    // moedas a mais quando bate o próprio recorde
  bonusMetaDiaria: 20,                                // uma vez por dia, na vitória que enche o coração
  xpBase: 10,
  xpPorEstrela: 5,
  xpDificuldade: { facil: 0, medio: 5, dificil: 10 }
};

/* =========================================================
   SOM (Web Audio) E NARRAÇÃO (voz gravada em midia/voz/)
   ========================================================= */
let audio = null;
// volume escolhido nas Configurações (0 a 10). Sons e música: 8 é o volume original
// (dá para subir um pouco, até +2 dB); narração: 10 é o volume cheio da voz.
const PADRAO_VOLUME = { som: 8, musica: 8, voz: 10 };
const nivelVolume = tipo => estado.volumes?.[tipo] ?? PADRAO_VOLUME[tipo];
const fatorVolume = tipo => nivelVolume(tipo) / (tipo === 'voz' ? 10 : 8);
// saída dos efeitos com o volume dos Sons
function saidaSons() {
  const g = audio.createGain();
  g.gain.value = fatorVolume('som');
  g.connect(audio.destination);
  return g;
}
// O clique e os outros efeitos ficam na parte da música (cliqueMusical e tocarEfeito),
// porque tocam no tom da música da tela.
function tocar(tipo) {
  if (!estado.som) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    if (tipo === 'clique') cliqueMusical(audio, saidaSons(), audio.currentTime);
    else tocarEfeito(audio, saidaSons(), tipo, audio.currentTime);
  } catch (e) { /* navegador sem áudio */ }
}

/* ---------- NARRAÇÃO ----------
   Cada frase que o app fala tem um áudio pronto, gravado com a voz escolhida no
   "Estudo de voz — Educatata.md" (uma voz de IA criada para o app, que não imita ninguém).
   Os áudios ficam em poucos pacotes (midia/voz/voz-<grupo>.js, um por tela ou jogo, com os
   MP3 em base64), que abrem também sem servidor. O código de cada frase é calculado do texto
   (chaveVoz), então frases iguais usam o mesmo áudio. Se o áudio não existir (ex.: só o
   index.html baixado, sem a pasta midia), a frase é lida pela voz do aparelho.
   Há um canal só para a narração: uma fala nova corta a anterior (ou espera a vez,
   com fila) e calar() para tudo na hora, ao trocar de tela ou fechar uma janela.
   Assim duas vozes nunca tocam juntas. */
const PASTA_VOZ = 'midia/voz/';
const PAUSA_ENTRE_FRASES = 200;   // ms de silêncio entre duas frases da mesma fala
// pacote de cada frase ("grupo:código,código;grupo:..."): a linha entre as duas marcas é escrita pelo script da voz (não editar à mão)
// VOZ_GRAVADA: começo
const CODIGOS_VOZ = '';
// VOZ_GRAVADA: fim
const GRUPO_DA_VOZ = new Map();
CODIGOS_VOZ.split(';').forEach(parte => {
  const [grupo, lista] = parte.split(':');
  if (lista) lista.split(',').forEach(c => GRUPO_DA_VOZ.set(c, grupo));
});
// pacotes carregados: grupo -> { pronto (promessa), chaves: código -> posição, audios: [base64] }
const pacotesVoz = {};
// cada pacote, ao carregar, chama VOZ_PACOTE(grupo, chaves, audios)
window.VOZ_PACOTE = (grupo, chaves, audios) => {
  const p = pacotesVoz[grupo] || (pacotesVoz[grupo] = {});
  p.chaves = chaves; p.audios = audios;
  if (p.carregou) p.carregou();
};
function carregarPacoteVoz(grupo) {
  if (!grupo) return Promise.resolve();
  const p = pacotesVoz[grupo] || (pacotesVoz[grupo] = {});
  if (!p.pronto) p.pronto = new Promise(ok => {
    if (p.audios) return ok();
    p.carregou = ok;
    const s = document.createElement('script');
    s.src = `${PASTA_VOZ}voz-${grupo}.js`;
    s.onerror = ok;   // sem o arquivo (ex.: só o index.html baixado): a frase vai pela voz do aparelho
    document.head.appendChild(s);
  });
  return p.pronto;
}
// já começa a carregar o pacote de uma tela ou de um jogo, para a primeira fala sair sem espera
const GRUPOS_DA_TELA = { inicio: ['inicio', 'telas'], resultado: ['resultado', 'nivel'], visual: ['visual'], conquistas: ['conquistas'],
  caderno: ['caderno'], revisao: ['caderno'] };
function prepararVoz(tela, dados) {
  if (!estado.voz) return;
  const grupos = ['telas', ...(GRUPOS_DA_TELA[tela] || [])];
  if (tela === 'jogo' && JOGOS[dados]) grupos.push(dados);
  if (tela === 'carregando' && dados && JOGOS[dados.dados]) grupos.push(dados.dados);
  if ((tela === 'visual' || tela === 'progresso') && estado.moedas < 1000) grupos.push(`moedas${Math.floor(estado.moedas / 100)}`);
  grupos.forEach(carregarPacoteVoz);
}
// áudio de uma frase (base64), ou null se não houver
function audioDaFrase(codigo) {
  const p = pacotesVoz[GRUPO_DA_VOZ.get(codigo)];
  const i = p && p.chaves ? p.chaves[codigo] : undefined;
  return i === undefined ? null : p.audios[i];
}

// divide o texto em frases: depois de . ! ? seguidos de espaço (reticências não dividem).
// Tem que ser igual a dividir_frases() do script que grava os áudios.
function dividirFrases(texto) {
  const t = String(texto).normalize('NFC').replace(/\s+/g, ' ').trim();
  const frases = [];
  let ini = 0;
  for (let i = 0; i < t.length; i++) {
    if (!'.!?'.includes(t[i]) || t[i + 1] === '.' || (t[i] === '.' && t[i - 1] === '.')) continue;
    let j = i + 1;
    if (t[j] === '"' || t[j] === '”' || t[j] === ')') j++;
    if (t[j] !== ' ') continue;
    frases.push(t.slice(ini, j).trim());
    ini = j + 1;
  }
  frases.push(t.slice(ini).trim());
  return frases.filter(Boolean);
}

const codificadorVoz = new TextEncoder();
function chaveVoz(frase) {
  let h = 0x811c9dc5;
  for (const b of codificadorVoz.encode(String(frase).normalize('NFC').replace(/\s+/g, ' ').trim())) {
    h ^= b;
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

const narracao = {
  fila: [],        // falas esperando a vez (falar com fila: true)
  elemento: null,  // um <audio> só para toda a narração (no iPhone o mesmo elemento continua liberado)
  vez: 0,          // muda a cada corte: avisos de uma fala antiga são ignorados
  timer: null,
  pendente: null   // fala que o navegador não deixou tocar antes do primeiro toque na tela

// voz do aparelho (reserva): a melhor voz em português do Brasil que o aparelho tiver
let vozReserva = null;
function escolherVozReserva() {
  if (!('speechSynthesis' in window)) return null;
  const vozes = speechSynthesis.getVoices().filter(v => /^pt[-_]BR/i.test(v.lang));
  const nota = v => (/natural|neural|online|premium|enhanced|aprimorad/i.test(v.name) ? 4 : 0)
    + (/francisca|thalita|luciana|google/i.test(v.name) ? 2 : 0);
  return vozes.sort((a, b) => nota(b) - nota(a))[0] || null;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { vozReserva = escolherVozReserva(); };

// voz: { emocao, fila, forcar }
//   emocao: no Teatro, o mascote interpreta a fala (usa o áudio gravado com aquela emoção)
//   fila: espera a fala atual terminar (em vez de cortar); forcar: fala mesmo com a narração
//   desligada (só para o botão de ouvir, que é um pedido direto da criança)
// texto pode ser uma lista de frases (ex.: os produtos do Mercadinho, um por frase).
// Devolve a fala (para calarSe) ou null.
function falar(texto, voz = {}) {
  if ((!estado.voz && !voz.forcar) || !texto) return null;
  const frases = (Array.isArray(texto) ? texto : [texto]).flatMap(dividirFrases);
  if (!frases.length) return null;
  const chave = frases.join(' ') + '|' + (voz.emocao || '');
  if (falaAtual && falaAtual.chave === chave) return falaAtual;   // essa fala já está sendo lida
  const fala = { chave, frases, i: 0, voz };
  if (voz.fila && falaAtual) {
    if (!narracao.fila.some(f => f.chave === chave)) narracao.fila.push(fala);
    return fala;
  }
  pararSom();
  narracao.fila = [];
  comecarFala(fala);
  return fala;
}

function comecarFala(fala) {
  falaAtual = fala;
  abafarMusica(true);   // a música abaixa enquanto o app fala e volta no fim da fala
  tocarFrase(narracao.vez);
}

function tocarFrase(vez) {
  const fala = falaAtual;
  if (vez !== narracao.vez || !fala) return;
  if (fala.i >= fala.frases.length) return terminarFala(vez);
  const frase = fala.frases[fala.i];
  const proxima = () => {
    if (vez !== narracao.vez) return;
    fala.i++;
    clearTimeout(narracao.timer);
    narracao.timer = setTimeout(() => tocarFrase(vez), fala.i < fala.frases.length ? PAUSA_ENTRE_FRASES : 0);
  };
  const chave = chaveVoz(frase), emocao = fala.voz.emocao;
  const codigo = emocao && GRUPO_DA_VOZ.has(`${chave}-${emocao}`) ? `${chave}-${emocao}` : chave;
  if (!GRUPO_DA_VOZ.has(codigo)) return lerComVozDoAparelho(frase, vez, proxima);
  carregarPacoteVoz(GRUPO_DA_VOZ.get(codigo)).then(() => {
    if (vez !== narracao.vez) return;   // a fala foi cortada enquanto o pacote carregava
    const b64 = audioDaFrase(codigo);
    if (!b64) return lerComVozDoAparelho(frase, vez, proxima);
    const el = elementoVoz();
    el.onended = proxima;
    el.onerror = () => { if (vez === narracao.vez) lerComVozDoAparelho(frase, vez, proxima); };
    el.src = 'data:audio/mpeg;base64,' + b64;
    el.volume = Math.min(1, fatorVolume('voz'));
    el.play().catch(erro => {

      // antes do primeiro toque na tela o navegador não deixa tocar som: guarda para tocar depois
      if (erro && erro.name === 'NotAllowedError') { narracao.pendente = { fala, partida }; terminarFala(vez); }

  el.src = SILENCIO_MP3;

function lerComVozDoAparelho(frase, vez, depois) {
  if (!('speechSynthesis' in window)) return depois();

  abafarMusica(false);

// corta o som da fala atual (o áudio e a voz do aparelho), sem mexer na música

  const el = narracao.elemento;
  if (el) { el.onended = el.onerror = null; el.pause(); el.removeAttribute('src'); el.load(); }

function calar() {
  pararSom();

  narracao.pendente = null;
  falaAtual = null;
  abafarMusica(false);

function calarSe(fala) {
  if (!fala) return;
  if (falaAtual === fala) calar();
  else narracao.fila = narracao.fila.filter(f => f !== fala);

// espera a narração terminar (no máximo max ms) antes de seguir sozinho para outra tela ou rodada,
// para a última fala não ser cortada. Se a criança trocar de tela antes, não faz nada.
function depoisDaFala(fn, max = 6000) {
  const inicio = Date.now(), minha = partida;
  const ver = () => {
    if (minha !== partida) return;
    if (!falaAtual || Date.now() - inicio > max) fn(); else setTimeout(ver, 150);
  };
  ver();
}

// Percussão: cada som é um pedaço de chiado filtrado ou uma onda que cai de tom.
let ruidoBranco = null;      // 1 s de chiado, criado uma vez e reaproveitado
function ruido(ctx, saida, t, vol, tipo, freq, q, sumico) {
  if (!ruidoBranco) {
    ruidoBranco = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = ruidoBranco.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const fonte = ctx.createBufferSource(), filtro = ctx.createBiquadFilter(), g = ctx.createGain();
  fonte.buffer = ruidoBranco;
  filtro.type = tipo;
  filtro.frequency.value = freq;
  filtro.Q.value = q;
  g.gain.setValueAtTime(vol * 4, t);      // o filtro tira muita força do chiado; ×4 o deixa no nível das outras batidas
  g.gain.setTargetAtTime(0, t + .002, sumico);
  fonte.connect(filtro).connect(g).connect(saida);
  fonte.start(t, Math.random() * .5);     // cada batida usa um trecho diferente do chiado
  fonte.stop(t + sumico * 6 + .01);
}
function batida(ctx, saida, t, vol, freq, freqFim, sumico, onda = 'sine') {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = onda;
  o.frequency.setValueAtTime(freq, t);
  if (freqFim !== freq) o.frequency.exponentialRampToValueAtTime(freqFim, t + sumico);
  g.gain.setValueAtTime(vol, t);
  g.gain.setTargetAtTime(0, t + .002, sumico);
  o.connect(g).connect(saida);
  o.start(t);
  o.stop(t + sumico * 6 + .01);
}

// --- leitura das partituras ------------------------------------------------
const NOTAS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const TIPOS_ACORDE = {
  '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], '7M': [0, 4, 7, 11],
  m7: [0, 3, 7, 10], m6: [0, 3, 7, 9], 6: [0, 4, 7, 9], dim: [0, 3, 6], sus4: [0, 5, 7]
};
const acidente = a => a === '#' ? 1 : a === 'b' ? -1 : 0;

// "F#4" → 66 (número MIDI); devolve null se não for uma nota
function midiDaNota(s) {
  const r = s.match(/^([A-G])([#b]?)(\d)$/);
  return r ? 12 * (+r[3] + 1) + NOTAS[r[1]] + acidente(r[2]) : null;
}
// "Bbm6" → { tonica: 10, intervalos: [0, 3, 7, 9] }
function lerAcorde(s) {
  const [, nota, a, tipo] = s.match(/^([A-G])([#b]?)(.*)$/);
  return { tonica: (NOTAS[nota] + acidente(a) + 12) % 12, intervalos: TIPOS_ACORDE[tipo] };
}
// Transforma o texto das notas numa lista de passos. Cada nota guarda o símbolo e
// quantos passos dura (conta os "-" seguintes); pausas viram null.
function lerNotas(texto, passosPorCompasso) {
  const eventos = [];
  let ultima = null;
  for (const s of texto.split(/[\s|]+/).filter(Boolean)) {
    if (s === '_') { for (let k = 0; k < passosPorCompasso; k++) eventos.push(null); ultima = null; }
    else if (s === '.') { eventos.push(null); ultima = null; }
    else if (s === '-') { if (ultima) ultima.dur++; eventos.push(null); }
    else { ultima = { som: s, dur: 1 }; eventos.push(ultima); }
  }
  return eventos;
}
const musicasLidas = {};     // cada música é lida uma vez só
function prepararMusica(nome) {
  if (musicasLidas[nome]) return musicasLidas[nome];
  const m = MUSICAS[nome];
  return (musicasLidas[nome] = {
    ...m,
    balanco: m.balanco || 0,
    acordes: m.acordes.split('|').map(g => g.trim().split(/\s+/).map(lerAcorde)),
    faixas: m.faixas.map(f => {
      const passos = f.passos || 2;
      return { camada: 0, pan: 0, eco: 0, centro: 60, ...f, passos, eventos: lerNotas(f.notas, m.compasso * passos) };
    })
  });
}

// --- síntese ---------------------------------------------------------------
// a altura (MIDI) mais perto do centro para uma classe de nota (0 = dó ... 11 = si),
// para os acordes não pularem de altura de um para o outro
function pertoDe(classe, centro) {
  const n = centro - ((centro - classe) % 12 + 12) % 12;
  return centro - n > 6 ? n + 12 : n;
}
function grauDoAcorde(acorde, grau) {
  const iv = acorde.intervalos;
  return { 1: 0, 2: 2, 3: iv[1], 4: 5, 5: iv[2], 6: 9, 7: iv[3] ?? 10 }[grau];
}

// Toca uma nota de um instrumento: soma as parciais, cada uma com seu volume e seu sumiço.
function tocarNota(ctx, saida, r, midi, t, dur, vol) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const fim = Math.max(t + dur, t + r.ataque + .02);
  let destino = saida;
  if (r.filtro) {
    const filtro = ctx.createBiquadFilter();
    const [inicio, final, rapidez] = r.filtro;
    filtro.frequency.setValueAtTime(inicio, t);
    if (final) filtro.frequency.setTargetAtTime(final, t, rapidez);
    filtro.connect(saida);
    destino = filtro;
  }
  const vibrato = r.vibrato ? ctx.createOscillator() : null;
  if (vibrato) vibrato.frequency.value = r.vibrato[0];
  let acabaTudo = t;
  for (const [onda, mult, ganho, sumico] of r.parciais) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = onda;
    o.frequency.value = f * mult;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(ganho * vol, t + r.ataque);
    let acaba;
    if (sumico) {                         // batido ou pinçado: cai sozinho
      g.gain.setTargetAtTime(0, t + r.ataque, sumico);
      acaba = t + r.ataque + sumico * 6;
      if (r.abafar) { g.gain.setTargetAtTime(0, fim, .03); acaba = Math.min(acaba, fim + .2); }
    } else {                              // soprado ou de fole: segura até o fim da nota
      const soltar = r.soltar || .08;
      g.gain.setTargetAtTime(0, fim, soltar);
      acaba = fim + soltar * 6;
    }
    if (vibrato) {                        // o vibrato começa devagar, como num sopro de verdade
      const tamanho = ctx.createGain();
      tamanho.gain.setValueAtTime(0, t);
      tamanho.gain.linearRampToValueAtTime(f * mult * r.vibrato[1], t + r.vibrato[2] + .01);
      vibrato.connect(tamanho).connect(o.frequency);
    }
    o.connect(g).connect(destino);
    o.start(t);
    o.stop(acaba);
    acabaTudo = Math.max(acabaTudo, acaba);
  }
  if (vibrato) { vibrato.start(t); vibrato.stop(acabaTudo); }
  if (r.sopro) ruido(ctx, destino, t, r.sopro * vol * .075, 'bandpass', Math.min(f * 2, 9000), 1, .04);
}

// Toca um passo de uma faixa: uma batida, uma nota, um grau do acorde ou o acorde inteiro.
function tocarEvento(ctx, faixa, ev, acorde, t, dur) {
  const perc = PERCUSSAO[faixa.inst];
  if (perc) { perc(ctx, faixa.no, t, ev.som === 'X' ? 1 : .55); return; }
  let notas;
  if (ev.som === 'A') {
    notas = acorde.intervalos.map(iv => pertoDe((acorde.tonica + iv) % 12, faixa.centro)).sort((a, b) => a - b);
  } else if (/^[1-8]$/.test(ev.som)) {
    const tonica = pertoDe(acorde.tonica, faixa.centro);
    notas = [ev.som === '8' ? tonica + 12 : pertoDe((acorde.tonica + grauDoAcorde(acorde, +ev.som)) % 12, faixa.centro)];
  } else {
    notas = [midiDaNota(ev.som)];
  }
  const r = INSTRUMENTOS[faixa.inst];
  const vol = notas.length > 1 ? .6 : 1;   // acorde: cada nota um pouco mais baixa
  notas.forEach((n, k) => tocarNota(ctx, faixa.no, r, n, t + k * (r.rasgado || 0), dur, vol));
}

// Reverberação: o "som da sala", feito de chiado que some aos poucos em 1,6 s.
let respostaDaSala = null;
function criarEco(ctx) {
  if (!respostaDaSala || respostaDaSala.sampleRate !== ctx.sampleRate) {
    const n = Math.floor(ctx.sampleRate * 1.6);
    respostaDaSala = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = respostaDaSala.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    }
  }
  const sala = ctx.createConvolver(), macio = ctx.createBiquadFilter();
  sala.buffer = respostaDaSala;
  macio.frequency.value = 3500;           // eco sem chiado agudo
  sala.connect(macio);
  return { entrada: sala, saida: macio };
}

// Monta uma música num contexto de áudio (o do app ou um de teste) e devolve a saída e
// tocarTique(i, t, nivel), que toca tudo o que cai no tique i. Um tique é 1/4 de tempo.
function montarMusica(ctx, nome) {
  const m = prepararMusica(nome);
  const soma = ctx.createGain(), saida = ctx.createGain();
  const compressor = ctx.createDynamicsCompressor();   // segura os picos quando muitas notas soam juntas
  compressor.threshold.value = -10;
  compressor.ratio.value = 3;
  soma.connect(compressor).connect(saida);
  const eco = criarEco(ctx);
  eco.saida.connect(soma);
  const faixas = m.faixas.map(f => {
    const no = ctx.createGain();
    no.gain.value = f.vol;
    if (f.pan && ctx.createStereoPanner) {
      const lado = ctx.createStereoPanner();
      lado.pan.value = f.pan;
      no.connect(lado).connect(soma);
    } else no.connect(soma);
    if (f.eco) {
      const envio = ctx.createGain();
      envio.gain.value = f.eco;
      no.connect(envio).connect(eco.entrada);
    }
    return { ...f, no };
  });
  const tique = 60 / m.bpm / 4;
  const tiquesPorCompasso = m.compasso * 4;
  return {
    saida, faixas, tique, tiquesPorCompasso, volume: m.volume,
    tocarTique(i, t, nivel) {
      const grupo = m.acordes[Math.floor(i / tiquesPorCompasso) % m.acordes.length];
      const acorde = grupo[Math.floor((i % tiquesPorCompasso) * grupo.length / tiquesPorCompasso)];
      for (const f of faixas) {
        if (f.camada > nivel) continue;
        const cada = 4 / f.passos;          // de quantos em quantos tiques a faixa anda
        if (i % cada) continue;
        const passo = i / cada;
        const ev = f.eventos[passo % f.eventos.length];
        if (!ev) continue;
        const duracao = tique * cada;
        const atraso = passo % 2 ? m.balanco * duracao : 0;   // swing: a colcheia fraca atrasa um pouco
        tocarEvento(ctx, f, ev, acorde, t + atraso, ev.dur * duracao - atraso);
      }
    }
  };
}

// Clique: uma "bolhinha" de madeira curta, afinada no tom da música da tela.
// Ela toca a 5ª nota do tom (o sol, em dó), que combina com quase todos os acordes.
// Toques rápidos seguidos sobem uma escadinha de 5 notas (pentatônica), como os pinos
// do Peggle; depois de uma pausa, a escadinha volta para a primeira nota.
let ultimoClique = -1, degrauClique = 0;
function cliqueMusical(ctx, saida, t) {
  const m = musicaDoTom();
  const escada = m.modo === 'menor' ? [0, 3, 5, 8, 10] : [0, 2, 5, 7, 9];
  degrauClique = t - ultimoClique < .45 ? (degrauClique + 1) % escada.length : 0;
  ultimoClique = t;
  const f = 440 * Math.pow(2, ((m.tom + 7) % 12 + 72 + escada[degrauClique] - 69) / 12);
  // corpo: sobe rápido de 3/4 da nota até ela (o "blup" da bolha) e some em menos de 0,1 s
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(f * .75, t);
  o.frequency.exponentialRampToValueAtTime(f, t + .015);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.12, t + .003);
  g.gain.setTargetAtTime(0, t + .003, .022);
  o.connect(g).connect(saida);
  o.start(t);
  o.stop(t + .16);
  // brilho: uma parcial 4 vezes mais aguda e curtinha, como a batida de uma baqueta de madeira
  batida(ctx, saida, t, .025, f * 4, f * 4, .006);
}

// A música que dá o tom dos efeitos: a da tela ou, na vitória (que não tem música), a do jogo que acabou.
function musicaDoTom() {
  return MUSICAS[musicaTocando || musicaDesejada || ultimaMusica] || MUSICAS.inicio;
}

// Efeitos sonoros: frases curtinhas no tom da música, com os mesmos instrumentos das músicas.
// grau(k) é a k-ésima nota da escala pentatônica a partir da tônica (k negativo desce).
function tocarEfeito(ctx, saida, tipo, t) {
  const m = musicaDoTom();
  const tonica = 67 + (m.tom % 12 + 5) % 12;               // a tônica do tom, entre sol4 e fá#5
  const menor = m.modo === 'menor' && tipo !== 'vitoria';  // a vitória termina sempre em maior
  const escala = menor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
  const grau = (k, base = tonica) => base + escala[(k % 5 + 5) % 5] + 12 * Math.floor(k / 5);
  const volume = ctx.createGain();
  volume.connect(saida);
  const nota = (inst, midi, inicio, dur, vol = 1) => tocarNota(ctx, volume, INSTRUMENTOS[inst], midi, t + inicio, dur, vol);

  if (tipo === 'acerto') {
    // duas notas subindo; a cada acerto da partida o par sobe um degrau, como numa escada
    volume.gain.value = .078;
    const i = 3 + Math.min(acertosNaPartida, 4), base = tonica - 12;
    nota('kalimba', grau(i, base), 0, .08, .9);
    nota('kalimba', grau(i + 2, base), .08, .3);
    nota('sino', grau(i + 2, base) + 12, .08, .3, .25);
  } else if (tipo === 'erro') {
    // "toc-toc" de madeira que desce um degrau até a tônica: um "quase!", sem som de castigo
    volume.gain.value = .072;
    nota('madeira', grau(1, tonica - 12), 0, .1);
    nota('madeira', grau(0, tonica - 12), .11, .16, .9);
  } else if (tipo === 'moeda') {
    // "tlim": três sininhos rápidos subindo (sol, dó e mi, em dó maior)
    volume.gain.value = .057;
    nota('sino', grau(3), 0, .05, .7);
    nota('sino', grau(5), .045, .05, .8);
    nota('sino', grau(7), .09, .35);
  } else if (tipo === 'mascote') {
    // a "voz" do mascote: o pulo do motivo (sol grave, dó, SOL agudo)
    volume.gain.value = .058;
    nota('kalimba', grau(-2), 0, .07, .8);
    nota('kalimba', grau(0), .07, .07, .9);
    nota('kalimba', grau(3), .14, .35);
    nota('sino', grau(3) + 12, .14, .3, .2);
  } else if (tipo === 'vitoria') {
    // fanfarra: o motivo inteiro bem rápido, o pulo e um acorde final com baixo e sininhos
    volume.gain.value = .064;
    const p = .1;                                           // uma semicolcheia
    [0, -2, 1, -2, 2, -2].forEach((k, n) => nota('kalimba', grau(k), n * p, p, .85));
    nota('kalimba', grau(3), 6 * p, 2 * p);
    [0, 2, 3, 5].forEach((k, n) => nota('kalimba', grau(k), 8 * p + n * .02, 6 * p, .6));   // acorde dedilhado
    nota('baixo', tonica - 24, 8 * p, 6 * p, .9);
    [5, 7, 8].forEach((k, n) => nota('sino', grau(k), (8 + n) * p + .05, 4 * p, .3));
  }
}

// --- tocador do app ---------------------------------------------------------
let musicaDesejada = null;   // música da tela atual
let musicaTocando = null;
let timerMusica = null, volumeMusica = null, volumeBase = 0, elementoMusica = null;
let interagiu = false;       // navegadores só liberam som depois do primeiro toque
let nivelMusica = 0;         // quantas camadas extras a música toca agora (0, 1 ou 2)
let acertosNaPartida = 0;    // acertos desde o começo da partida (camadas e escada do som de acerto)
let ultimaMusica = 'inicio'; // última música pedida: dá o tom da vitória, que não tem música
let falando = false;         // enquanto a narração fala, a música fica mais baixa
const VOLUME_ARQUIVO = .35;  // volume das músicas em arquivo (ARQUIVOS_MUSICA)
const ABAFADO = .35;         // quanto sobra da música durante a narração

// a música da tela inicial cresce com o coração do dia: vazio = só o motivo,
// 1 ou 2 vitórias = entra a percussão, cheio = a banda inteira
function nivelDaCasa() {
  const v = vitoriasHoje();
  return v >= META_DIARIA ? 2 : v > 0 ? 1 : 0;
}
// chamado a cada acerto num jogo: no 1º entra a percussão, no 2º a segunda melodia
function animarMusica() {
  acertosNaPartida++;
  nivelMusica = Math.min(2, acertosNaPartida);
}
// abaixa a música enquanto a narração fala, para a voz ficar clara
function abafarMusica(sim) {
  falando = sim;
  const fator = (sim ? ABAFADO : 1) * fatorVolume('musica');
  if (volumeMusica && audio) volumeMusica.gain.setTargetAtTime(volumeBase * fator, audio.currentTime, .12);
  if (elementoMusica) elementoMusica.volume = Math.min(1, VOLUME_ARQUIVO * fator);
}

function pararMusica() {
  clearInterval(timerMusica);
  timerMusica = null;
  if (volumeMusica) {
    const g = volumeMusica;
    try { g.gain.setTargetAtTime(0, audio.currentTime, .1); } catch (e) { /* ok */ }
    setTimeout(() => g.disconnect(), 500);
    volumeMusica = null;
  }
  if (elementoMusica) { elementoMusica.pause(); elementoMusica = null; }
  musicaTocando = null;
}

function definirMusica(nome, forcar = false) {
  if (nome !== musicaDesejada) acertosNaPartida = 0;   // outra tela ou partida nova: a contagem recomeça
  musicaDesejada = nome;
  if (nome) ultimaMusica = nome;
  if (!interagiu || !estado.musica) return;
  if (nome === musicaTocando && !forcar) return;   // mesma música: não recomeça
  pararMusica();
  if (!nome) return;
  musicaTocando = nome;
  nivelMusica = nome === 'inicio' ? nivelDaCasa() : Math.min(2, acertosNaPartida);

  if (ARQUIVOS_MUSICA[nome]) {
    elementoMusica = new Audio(ARQUIVOS_MUSICA[nome]);
    elementoMusica.loop = true;
    elementoMusica.volume = Math.min(1, VOLUME_ARQUIVO * (falando ? ABAFADO : 1) * fatorVolume('musica'));
    elementoMusica.play().catch(() => {});
    return;
  }
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const musica = montarMusica(audio, nome);
    volumeMusica = musica.saida;
    volumeBase = musica.volume;
    volumeMusica.gain.value = volumeBase * (falando ? ABAFADO : 1) * fatorVolume('musica');
    volumeMusica.connect(audio.destination);
    // agenda as notas um pouco à frente (0,4 s), em pedaços, para o som não falhar
    let i = 0, proximo = audio.currentTime + .1, nivel = nivelMusica;
    const agendar = () => {
      while (proximo < audio.currentTime) { proximo += musica.tique; i++; }   // aba voltou de segundo plano: pula o atraso
      while (proximo < audio.currentTime + .4) {
        if (i % musica.tiquesPorCompasso === 0) nivel = nivelMusica;       // camada nova só entra no começo do compasso
        musica.tocarTique(i, proximo, nivel);
        proximo += musica.tique;
        i++;
      }
    };
    agendar();
    timerMusica = setInterval(agendar, 100);
  } catch (e) { /* navegador sem áudio */ }
}

// o primeiro toque na tela libera a música (e a narração que o navegador não deixou tocar antes dele)
document.addEventListener('pointerdown', () => {
  if (interagiu) return;
  interagiu = true;
  definirMusica(musicaDesejada, true);
  liberarVoz();
  const pendente = narracao.pendente;
  narracao.pendente = null;
  // se o toque não abriu outra tela nem começou outra fala, lê a tela de agora
  if (pendente) setTimeout(() => { if (pendente.partida === partida && !falaAtual) falar(pendente.fala.frases, pendente.fala.voz); }, 350);
}, true);

// transforma as linhas de um desenho em imagem (data URL), guardando para não redesenhar
const cacheArte = new Map();
function arteURL(linhas) {
  const chave = linhas.join('|');
  if (!cacheArte.has(chave)) {
    const tela = document.createElement('canvas');
    tela.width = linhas[0].length;
    tela.height = linhas.length;
    const ctx = tela.getContext('2d');
    linhas.forEach((linha, y) => [...linha].forEach((letra, x) => {
      if (letra === '.') return;
      ctx.fillStyle = PALETA_PX[letra];
      ctx.fillRect(x, y, 1, 1);
    }));
    cacheArte.set(chave, tela.toDataURL());
  }
  return cacheArte.get(chave);
}

// <img> de um desenho (nome em ARTE ou a própria lista de linhas), sempre ampliado por número inteiro
function arte(desenho, escala = ESCALA, alt = '', classe = '') {
  const l = typeof desenho === 'string' ? ARTE[desenho] : desenho;
  return `<img class="px ${classe}" src="${arteURL(l)}" width="${l[0].length * escala}" height="${l.length * escala}" alt="${alt}" draggable="false">`;
}

/* ---------- desenhos feitos com formas (figuras, dinheiro, balança) ----------
   grade(w, h, formas): cada forma é [teste(x, y), cor, contorno?]. A cor pode ser
   uma letra ou uma função (x, y) => letra. Como no mascote, cada forma ganha
   um contorno escuro de 1 pixel, a não ser que contorno seja false. */
function grade(w, h, formas) {
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  for (const [teste, cor, contorno = true] of formas) {
    const pontos = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (teste(x + .5, y + .5)) pontos.push([x, y]);
    const dentro = new Set(pontos.map(([x, y]) => y * w + x));
    pontos.forEach(([x, y]) => { g[y][x] = typeof cor === 'function' ? cor(x, y) : cor; });
    if (contorno) pontos.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const a = x + dx, b = y + dy;
      if (a >= 0 && a < w && b >= 0 && b < h && !dentro.has(b * w + a) && g[b][a] === '.') g[b][a] = 'K';
    }));
  }
  return g.map(l => l.join(''));
}
const retangulo = (x0, y0, x1, y1) => (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1;
const elipsePx = (cx, cy, rx, ry) => (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const poligono = pts => (x, y) => {   // ponto dentro do polígono (regra par-ímpar)
  let dentro = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dentro = !dentro;
  }
  return dentro;
};
// copia as linhas de "peca" para dentro de "linhas" na posição (x, y), sem os pontos transparentes
function colar(linhas, peca, x, y) {
  const g = linhas.map(l => [...l]);
  peca.forEach((l, j) => [...l].forEach((c, i) => { if (c !== '.' && g[y + j] && g[y + j][x + i] !== undefined) g[y + j][x + i] = c; }));
  return g.map(l => l.join(''));
}

// linhas de um texto na fonte pixel, com 1 pixel entre as letras (a letra "cor" pinta o texto)
function textoLinhas(texto, fonte = FONTE_GRANDE, cor = 'K') {
  const letras = [...String(texto).toUpperCase()].map(ch => (fonte[ch] || fonte[' ']).split('|'));
  const altura = letras[0].length;
  return Array.from({ length: altura }, (_, y) =>
    letras.map(l => l[y].replaceAll('#', cor)).join('.'));
}
// <img> de um texto em pixel art; "alt" é o que o leitor de tela fala
function textoPx(texto, { fonte = FONTE_GRANDE, cor = 'K', escala = ESCALA, alt = String(texto) } = {}) {
  return arte(textoLinhas(texto, fonte, cor), escala, alt);
}
// preço em pixel art, ex.: 250 -> "R$2,50"
const precoPx = (centavos, escala = 2, cor = 'K') =>
  textoPx('R$' + (centavos / 100).toFixed(2).replace('.', ','), { fonte: FONTE_PEQUENA, escala, cor, alt: reais(centavos) });

/* =========================================================
   SISTEMA DE VIDA (vitórias do dia)
   Funciona como uma nota diária: o coração enche conforme
   o aluno conclui partidas no dia.
   ========================================================= */
const META_DIARIA = 3;   // vitórias no dia para o coração ficar cheio

function diaDe(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const vitoriasNoDia = dia => estado.historico.filter(h => diaDe(h.data) === dia).length;
const vitoriasHoje = () => vitoriasNoDia(diaDe(Date.now()));

// vazio (começo do dia) → ¼ abaixo da média → ½ média → cheio alto
function coracaoDoDia(v = vitoriasHoje()) {
  const f = v / META_DIARIA;
  if (f >= 1) return { sprite: 'coracao-cheio', nota: 'Alto', texto: 'Coração cheio! Meta do dia cumprida.' };
  if (f >= .5) return { sprite: 'coracao-metade', nota: 'Média', texto: 'Na média. Falta pouco!' };
  if (f > 0) return { sprite: 'coracao-quarto', nota: 'Abaixo da média', texto: 'Bom começo! Continue jogando.' };
  return { sprite: 'coracao-vazio', nota: 'Ainda não jogou hoje', texto: 'Jogue para encher o coração.' };
}
